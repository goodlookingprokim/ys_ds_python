<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15212e">
  <link rel="icon" href="data:,">
  <title>2026 데이터 과학 수업 전자칠판</title>
  <style>
    :root {
      --ink: #15212e;
      --ink-2: #2c3a47;
      --paper: #fffdf7;
      --white: #ffffff;
      --mist: #eef3f4;
      --line: #cbd5d8;
      --cyan: #00a7c4;
      --blue: #3155c6;
      --yellow: #ffd447;
      --coral: #ef6253;
      --green: #238b57;
      --code: #111a24;
      --shadow: 0 8px 0 rgba(21, 33, 46, .12);
      --radius: 8px;
      --base-size: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background-color: var(--mist);
      background-image:
        linear-gradient(rgba(21, 33, 46, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 33, 46, .045) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: "NanumSquareRound", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: var(--base-size);
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    pre, code { word-break: normal; overflow-wrap: normal; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 4px solid rgba(0, 167, 196, .3);
      outline-offset: 2px;
    }
    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      transform: translateY(-140%);
      padding: 10px 14px;
      color: var(--white);
      background: var(--ink);
    }
    .skip-link:focus { transform: translateY(0); }
    .app { min-height: 100vh; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      min-height: 76px;
      padding: 10px clamp(14px, 3vw, 34px);
      color: var(--white);
      background: var(--ink);
      border-bottom: 5px solid var(--yellow);
    }
    .brand { min-width: 0; }
    .brand-kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--yellow);
      font-size: .76rem;
      font-weight: 800;
    }
    .brand h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mode-switch {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      border: 2px solid rgba(255,255,255,.32);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .mode-switch button {
      min-height: 38px;
      padding: 6px 12px;
      color: var(--white);
      background: transparent;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.26);
      font-weight: 800;
    }
    .mode-switch button:last-child { border-right: 0; }
    .mode-switch button.active { color: var(--ink); background: var(--yellow); }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--white);
      background: transparent;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: var(--radius);
      font-weight: 900;
    }
    .icon-btn:hover { background: rgba(255,255,255,.12); }
    .progress-track {
      grid-column: 1 / -1;
      height: 5px;
      margin: 0 -4px -4px;
      overflow: hidden;
      background: rgba(255,255,255,.18);
    }
    .progress-fill {
      width: 8%;
      height: 100%;
      background: var(--cyan);
      transition: width .45s ease;
    }
    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      align-items: start;
      gap: 18px;
      width: min(1760px, 100%);
      margin: 0 auto;
      padding: 18px clamp(12px, 2.4vw, 30px) 34px;
    }
    .sidebar {
      position: sticky;
      top: 94px;
      max-height: calc(100vh - 116px);
      overflow: auto;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .story-card {
      padding: 16px;
      background: var(--yellow);
      border-bottom: 2px solid var(--ink);
    }
    .story-card strong { display: block; margin-bottom: 7px; font-size: 1.05rem; }
    .story-card p { margin: 0; font-size: .88rem; line-height: 1.55; }
    .lesson-nav { display: grid; padding: 8px; }
    .lesson-btn {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 8px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    .lesson-btn:last-child { border-bottom: 0; }
    .lesson-btn:hover { background: var(--mist); }
    .lesson-btn.active { background: var(--ink); color: var(--white); }
    .lesson-number {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--ink);
      background: var(--yellow);
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: .78rem;
      font-weight: 900;
    }
    .lesson-btn.active .lesson-number { color: var(--ink); }
    .lesson-name { min-width: 0; font-size: .88rem; font-weight: 800; line-height: 1.25; }
    .content { min-width: 0; }
    .stage-head {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: clamp(20px, 3vw, 34px);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
    }
    .stage-head::after {
      content: "";
      position: absolute;
      right: -28px;
      bottom: -28px;
      width: 130px;
      height: 70px;
      background: var(--cyan);
      border: 2px solid var(--ink);
      transform: rotate(-12deg);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--blue);
      font-size: .8rem;
      font-weight: 900;
    }
    .stage-head h2 {
      max-width: 900px;
      margin: 0 0 10px;
      font-size: clamp(1.55rem, 3vw, 2.65rem);
      line-height: 1.12;
    }
    .stage-head p { max-width: 880px; margin: 0; color: var(--ink-2); line-height: 1.65; }
    .stage-head.practice-stage {
      color: var(--ink);
      background: #e8f7fa;
      border-color: var(--blue);
    }
    .stage-head.practice-stage::after { background: var(--yellow); border-color: var(--blue); }
    .practice-stage .eyebrow { color: var(--coral); }
    .practice-stage .stage-badge { background: var(--blue); transform: rotate(-2deg); }
    .stage-badge {
      position: relative;
      z-index: 1;
      align-self: start;
      min-width: 112px;
      padding: 10px 12px;
      color: var(--white);
      background: var(--coral);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      text-align: center;
      font-weight: 900;
      transform: rotate(2deg);
    }
    .practice-brief {
      display: grid;
      grid-template-columns: auto repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 12px clamp(18px, 3vw, 34px);
      color: var(--white);
      background: var(--ink);
      border-right: 2px solid var(--blue);
      border-left: 2px solid var(--blue);
    }
    .practice-brief > strong { color: var(--yellow); font-size: .9rem; }
    .practice-step { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: .82rem; font-weight: 800; }
    .practice-step b {
      display: inline-grid;
      flex: 0 0 26px;
      place-items: center;
      width: 26px;
      height: 26px;
      color: var(--ink);
      background: var(--yellow);
      border-radius: 50%;
    }
    .lesson-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(310px, .82fr);
      gap: 0;
      background: var(--white);
      border: 2px solid var(--ink);
      border-top: 0;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }
    .practice-mode .lesson-grid { border-color: var(--blue); }
    .practice-layout .simulator-band { background: #f2fbfd; }
    .practice-layout .quiz-band { background: #fffbed; }
    .main-column { min-width: 0; border-right: 2px solid var(--ink); }
    .side-column { min-width: 0; background: #f8faf9; }
    .band { padding: clamp(18px, 2.4vw, 28px); border-bottom: 2px solid var(--ink); }
    .band:last-child { border-bottom: 0; }
    .band-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      font-size: 1.06rem;
    }
    .band-index {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-size: .78rem;
    }
    .concept-text { line-height: 1.7; }
    .concept-text p { margin: 0 0 11px; }
    .concept-text ul { margin: 8px 0 0; padding-left: 21px; }
    .concept-text li { margin: 5px 0; }
    .key-list { display: grid; gap: 8px; margin-top: 14px; }
    .key-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      padding: 10px 12px;
      background: var(--mist);
      border-left: 5px solid var(--cyan);
    }
    .key-item code { color: var(--blue); font-weight: 900; }
    .life-example {
      margin-top: 14px;
      padding: 13px 14px;
      background: #fff8d7;
      border-left: 6px solid var(--yellow);
      line-height: 1.68;
    }
    .life-example strong { display: block; margin-bottom: 4px; }
    .code-shell { overflow: hidden; background: var(--code); border: 2px solid var(--ink); border-radius: var(--radius); }
    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 7px 9px 7px 13px;
      color: #c7d2de;
      background: #23303d;
      border-bottom: 1px solid #42505f;
      font-size: .78rem;
    }
    .code-toolbar strong { color: var(--yellow); }
    .copy-btn {
      min-height: 30px;
      padding: 4px 9px;
      color: var(--white);
      background: transparent;
      border: 1px solid #687788;
      border-radius: 6px;
    }
    pre {
      max-height: 430px;
      margin: 0;
      overflow: auto;
      padding: 18px;
      color: #e7edf3;
      font-family: Menlo, Monaco, "NanumGothicCoding", monospace;
      font-size: .86rem;
      line-height: 1.65;
      white-space: pre;
      tab-size: 4;
    }
    .simulator { min-height: 280px; }
    .sim-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      padding: 14px;
      background: #e8f7fa;
      border: 2px solid var(--ink);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .control { display: grid; gap: 4px; min-width: 120px; }
    .sim-toolbar > .control { flex: 1 1 150px; min-width: 0; }
    .sim-toolbar > .control select { width: 100%; }
    .control label, .control .label { font-size: .75rem; font-weight: 900; }
    select, input[type="number"] {
      min-height: 38px;
      max-width: 100%;
      padding: 7px 9px;
      color: var(--ink);
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 6px;
    }
    input[type="range"] { width: 150px; accent-color: var(--blue); }
    .run-btn, .primary-btn, .secondary-btn {
      min-height: 40px;
      padding: 8px 14px;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      font-weight: 900;
      text-align: center;
    }
    .run-btn, .primary-btn { color: var(--white); background: var(--blue); box-shadow: 0 4px 0 var(--ink); }
    .run-btn:active, .primary-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .secondary-btn { color: var(--ink); background: var(--white); }
    .sim-output {
      min-height: 210px;
      overflow: auto;
      padding: 16px;
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 174px;
      color: #64727f;
      text-align: center;
      line-height: 1.55;
    }
    .output-title { margin: 0 0 12px; font-size: 1rem; }
    .data-table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { padding: 9px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    th { color: var(--white); background: var(--ink); }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    tr.highlight td { background: #fff4b8; font-weight: 900; }
    .nan { color: var(--coral); font-weight: 900; }
    .metric-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .metric { padding: 12px; background: var(--mist); border: 2px solid var(--ink); border-radius: var(--radius); }
    .metric span { display: block; margin-bottom: 4px; color: #566471; font-size: .74rem; font-weight: 800; }
    .metric strong { font-size: 1.5rem; }
    .array-grid { display: grid; gap: 5px; max-width: 620px; }
    .array-cell { display: grid; place-items: center; min-height: 48px; background: var(--yellow); border: 2px solid var(--ink); font-weight: 900; animation: pop .28s both; }
    .score-inputs { display: grid; grid-template-columns: 70px repeat(3, minmax(64px, 1fr)); gap: 6px; align-items: center; }
    .score-inputs strong { font-size: .8rem; }
    .score-inputs input { width: 100%; }
    .chart-wrap { min-height: 320px; }
    canvas { display: block; width: 100%; height: 310px; background: var(--white); }
    .caption { margin: 10px 0 0; color: #566471; font-size: .82rem; line-height: 1.55; }
    .teacher-tip { padding: 14px; background: #e8f7ef; border-left: 6px solid var(--green); line-height: 1.6; }
    .teacher-tip strong { display: block; margin-bottom: 5px; }
    .practice-mode .teacher-only { display: none; }
    .quiz-card { padding: 0; }
    .difficulty {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      color: var(--ink);
      background: var(--yellow);
      border: 1px solid var(--ink);
      border-radius: 5px;
      font-size: .74rem;
      font-weight: 900;
    }
    .difficulty.medium { color: var(--white); background: var(--cyan); }
    .difficulty.hard { color: var(--white); background: var(--coral); }
    .quiz-question { margin: 0 0 14px; font-size: 1rem; line-height: 1.6; }
    .choices { display: grid; gap: 8px; }
    .choice {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      min-height: 44px;
      padding: 10px;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      line-height: 1.45;
    }
    .choice:hover { border-color: var(--cyan); }
    .choice:has(input:checked) { border-color: var(--blue); background: #edf1ff; }
    .choice input { margin-top: 3px; accent-color: var(--blue); }
    .quiz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .feedback { margin-top: 14px; padding: 14px; border: 2px solid var(--ink); border-radius: var(--radius); line-height: 1.62; animation: rise .3s ease both; }
    .feedback.correct { background: #e8f7ef; border-left: 8px solid var(--green); }
    .feedback.wrong { background: #fff0ed; border-left: 8px solid var(--coral); }
    .feedback h4 { margin: 0 0 8px; }
    .daily-example {
      margin: 12px 0;
      padding: 12px 13px;
      background: #eef7ff;
      border-left: 6px solid var(--blue);
      line-height: 1.68;
    }
    .daily-example strong { display: block; margin-bottom: 4px; color: var(--blue); }
    .solution-steps { margin: 9px 0; padding-left: 21px; }
    .choice-review { display: grid; gap: 6px; margin-top: 12px; }
    .review-row { padding: 9px; background: rgba(255,255,255,.72); border-left: 4px solid var(--line); font-size: .86rem; }
    .review-row.answer { border-left-color: var(--green); }
    .assessment-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 18px;
      padding: clamp(18px, 3vw, 34px);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .assessment-main { min-width: 0; }
    .assessment-main h2 { margin: 0 0 8px; font-size: clamp(1.55rem, 3vw, 2.45rem); }
    .assessment-sub { margin: 0 0 22px; color: #566471; line-height: 1.6; }
    .assessment-panel { padding: 20px; background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius); }
    .assessment-side { align-self: start; padding: 18px; color: var(--white); background: var(--ink); border-radius: var(--radius); }
    .score-big { display: block; margin: 8px 0 2px; color: var(--yellow); font-size: 2.6rem; font-weight: 900; }
    .question-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 18px 0; }
    .question-dot { min-height: 36px; padding: 4px; color: var(--white); background: transparent; border: 1px solid #72808d; border-radius: 5px; }
    .question-dot.active { color: var(--ink); background: var(--yellow); border-color: var(--yellow); }
    .question-dot.done { background: var(--green); border-color: var(--green); }
    .assessment-side .secondary-btn { width: 100%; margin-top: 8px; }
    .summary-box { padding: 20px; background: #e8f7ef; border: 2px solid var(--ink); border-radius: var(--radius); line-height: 1.65; }
    .bottom-nav {
      position: fixed;
      z-index: 25;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr minmax(180px, 420px) 1fr;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 9px clamp(12px, 3vw, 34px) calc(9px + env(safe-area-inset-bottom));
      color: var(--white);
      background: rgba(21, 33, 46, .97);
      border-top: 4px solid var(--cyan);
    }
    .bottom-nav button { min-height: 42px; padding: 8px 14px; color: var(--white); background: transparent; border: 1px solid #71808d; border-radius: var(--radius); font-weight: 900; }
    .bottom-nav button:hover:not(:disabled) { background: rgba(255,255,255,.11); }
    .bottom-nav button:disabled { opacity: .35; cursor: not-allowed; }
    .next-btn { justify-self: end; }
    .step-status { text-align: center; font-size: .82rem; font-weight: 800; }
    .toast {
      position: fixed;
      z-index: 80;
      right: 18px;
      bottom: 84px;
      max-width: min(390px, calc(100vw - 36px));
      padding: 11px 14px;
      color: var(--white);
      background: var(--ink);
      border: 2px solid var(--yellow);
      border-radius: var(--radius);
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: .25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1100px) {
      .lesson-grid { grid-template-columns: 1fr; }
      .main-column { border-right: 0; border-bottom: 2px solid var(--ink); }
      .assessment-shell { grid-template-columns: 1fr; }
      .assessment-side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .question-map { margin: 0; }
    }
    @media (max-width: 840px) {
      .topbar { grid-template-columns: minmax(0, 1fr) auto; }
      .mode-switch { grid-column: 1 / -1; grid-row: 2; }
      .mode-switch button { min-height: 46px; white-space: nowrap; }
      .top-actions { grid-column: 2; grid-row: 1; }
      .icon-btn { width: 44px; height: 44px; }
      .layout { grid-template-columns: 1fr; padding-top: 12px; }
      .sidebar { position: static; max-height: none; }
      .story-card { display: none; }
      .lesson-nav { display: flex; gap: 5px; overflow-x: auto; padding: 7px; }
      .lesson-btn { flex: 0 0 160px; border: 1px solid var(--line); border-radius: 6px; }
      .stage-head { grid-template-columns: 1fr; }
      .stage-badge { justify-self: start; }
      .practice-brief { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .practice-brief > strong { grid-column: 1 / -1; }
      .bottom-nav { grid-template-columns: minmax(82px, 1fr) auto minmax(82px, 1fr); }
      .bottom-nav button { min-width: 82px; white-space: nowrap; }
    }
    @media (max-width: 560px) {

        model:'문자열 대체는 방문객 수 열에 숫자와 문자를 섞어 평균 같은 수치 분석을 어렵게 한다.'
      },
      {
        id:'q12', level:'어려움', prompt:'“미니게임의 대기 시간이 25분이므로 언제나 운영이 가장 나쁜 부스다”의 가장 큰 문제는?',
        choices:[['25분은 긴 시간이 아니기 때문이다','주어진 표에서는 다섯 부스 중 가장 긴 대기 시간이 맞습니다. 핵심 문제는 결론의 범위입니다.'],['미니게임을 표에서 찾을 수 없기 때문이다','표에 미니게임이 분명히 있습니다.'],['한 번의 대기 기록을 언제나로 넓히고 긴 줄의 원인도 확인하지 않았다','정답입니다. 표에서 확인한 사실보다 결론을 지나치게 넓혔습니다.'],['대기 시간은 서로 비교할 수 없기 때문이다','같은 단위의 대기 시간은 비교할 수 있지만 조사 조건과 원인을 확인해야 합니다.']], answer:2,
        steps:['표에서 직접 확인되는 사실은 이번 기록에서 미니게임의 대기 시간 25분이 가장 길다는 것입니다.','긴 줄은 인기, 게임 시간, 운영 인원 등 여러 이유로 생길 수 있습니다.','다른 시간과 날짜 자료가 없으므로 언제나 운영이 나쁘다고 일반화할 수 없습니다.'],
        daily:'오늘 한 번 버스가 늦었다고 그 노선이 언제나 가장 나쁘다고 말할 수는 없습니다. 날짜, 교통 상황, 여러 번의 도착 기록을 함께 봐야 합니다.',
        model:'이번 다섯 부스 기록에서는 미니게임의 대기 시간이 25분으로 가장 길지만 한 번의 관찰만으로 언제나 운영이 가장 나쁘다고 단정할 수 없다.'
      }
    ];

    const state = {
      lesson:0,
      mode:'수업',
      fontSize:16,
      runAction:null,
      practiceAnswers:{},
      assessmentAnswers:{},
      assessmentIndex:0,
      assessmentFinished:false
    };

    const app = document.querySelector('#app');
    const content = document.querySelector('#lessonContent');
    const nav = document.querySelector('#lessonNav');
    const toast = document.querySelector('#toast');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function sum(values) { return values.reduce((total, value) => total + Number(value), 0); }
    function mean(values) { return values.length ? sum(values) / values.length : NaN; }
    function cloneRows(rows) { return rows.map(row => ({...row})); }

    function tableHtml(rows, columns, highlightIndex = null) {
      if (!rows.length) return '<div class="empty-state">조건에 맞는 행이 없습니다.<br>비교 기호와 기준값을 다시 확인하세요.</div>';
      return `<div class="data-table-wrap"><table><thead><tr>${columns.map(column => `<th>${escapeHtml(column)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index) => `<tr class="${index === highlightIndex ? 'highlight' : ''}">${columns.map(column => `<td>${row[column] === null || Number.isNaN(row[column]) ? '<span class="nan">NaN</span>' : escapeHtml(row[column])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function announce(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(announce.timer);
      announce.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function levelClass(level) { return level === '중간' ? 'medium' : level === '어려움' ? 'hard' : ''; }
    function answersForCurrentMode() { return state.mode === '평가' ? state.assessmentAnswers : state.practiceAnswers; }

    function renderNav() {
      nav.innerHTML = lessons.map((lesson,index) => `<button type="button" class="lesson-btn ${index === state.lesson ? 'active' : ''}" data-lesson="${index}"><span class="lesson-number">${String(index + 1).padStart(2,'0')}</span><span class="lesson-name">${escapeHtml(lesson.title)}</span></button>`).join('');
      nav.querySelectorAll('[data-lesson]').forEach(button => button.addEventListener('click', () => goLesson(Number(button.dataset.lesson))));
    }

    function renderLesson() {
      app.classList.toggle('practice-mode', state.mode === '연습');
      if (state.mode === '평가') {
        renderAssessment();
        updateChrome();
        return;
      }
      const lesson = lessons[state.lesson];
      const isPractice = state.mode === '연습';
      const stepNumber = String(state.lesson + 1).padStart(2,'0');
      const conceptBand = `<article class="band concept-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '4' : '1'}</span> 쉬운 말로 개념 잡기</h3>
        <div class="concept-text"><p>${escapeHtml(lesson.concept)}</p></div>
        <div class="life-example"><strong>생활 속에서 떠올리기</strong>${escapeHtml(lesson.example)}</div>
        <div class="key-list">${lesson.keys.map(item => `<div class="key-item"><code>${escapeHtml(item[0])}</code><span>${escapeHtml(item[1])}</span></div>`).join('')}</div>
      </article>`;
      const codeBand = `<article class="band code-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '3' : '2'}</span> 코랩 코드 읽기</h3>
        <div class="code-shell">
          <div class="code-toolbar"><span><strong>Colab</strong> · Python</span><button type="button" class="copy-btn" id="copyCode">코드 복사</button></div>
          <pre><code id="codeText"></code></pre>
        </div>
      </article>`;
      const simulatorBand = `<article class="band simulator-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '1' : '3'}</span> ${isPractice ? '먼저 예상하고 직접 실행하기' : '실행 결과 시뮬레이터'}</h3>
        <div class="simulator" id="simulator"></div>
      </article>`;
      const quizBand = `<section class="band quiz-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '2' : '4'}</span> ${isPractice ? '내 말로 풀어 보는 문제' : '바로 확인 문제'}</h3>
        <div id="quickQuiz"></div>
      </section>`;
      const lessonBody = isPractice
        ? `<section class="lesson-grid practice-layout"><div class="main-column">${simulatorBand}${quizBand}</div><aside class="side-column">${codeBand}${conceptBand}</aside></section>`
        : `<section class="lesson-grid"><div class="main-column">${conceptBand}${codeBand}${simulatorBand}</div><aside class="side-column"><section class="band teacher-only"><h3 class="band-title"><span class="band-index">T</span> 교사용 진행 포인트</h3><div class="teacher-tip"><strong>칠판 질문</strong>${escapeHtml(lesson.tip)}</div></section>${quizBand}</aside></section>`;
      content.innerHTML = `
        <section class="stage-head ${isPractice ? 'practice-stage' : ''}">
          <div>
            <span class="eyebrow">${isPractice ? '연습 미션' : escapeHtml(lesson.chapter)} · STEP ${stepNumber}</span>
            <h2>${isPractice ? `미션 ${stepNumber}. ` : ''}${escapeHtml(lesson.title)}</h2>
            <p>${isPractice ? '설명부터 외우지 않습니다. 결과를 먼저 예상하고, 값을 바꾸어 실행한 뒤, 문제로 이유를 확인합니다.' : escapeHtml(lesson.story)}</p>
          </div>
          <div class="stage-badge">${isPractice ? '직접 해보기' : escapeHtml(lesson.badge)}</div>
        </section>
        ${isPractice ? `<section class="practice-brief" aria-label="연습 순서"><strong>연습 순서</strong><span class="practice-step"><b>1</b>결과 예상</span><span class="practice-step"><b>2</b>값 바꾸기</span><span class="practice-step"><b>3</b>직접 실행</span><span class="practice-step"><b>4</b>이유 설명</span></section>` : ''}
        ${lessonBody}`;
      document.querySelector('#codeText').textContent = lesson.code;
      document.querySelector('#copyCode').addEventListener('click', () => copyText(lesson.code));
      mountSimulator(lesson.sim);
      renderQuiz(questions.find(question => question.id === lesson.question), document.querySelector('#quickQuiz'), true);
      renderNav();
      updateChrome();
    }

    function simulatorShell(controls) {
      const simulator = document.querySelector('#simulator');
      simulator.innerHTML = `<div class="sim-toolbar">${controls}<button type="button" class="run-btn" id="runCell">▶ 실행</button></div><div class="sim-output" id="simOutput" aria-live="polite"><div class="empty-state">실행하기 전에 결과를 먼저 예상하세요.<br>그다음 실행 버튼으로 확인합니다.</div></div>`;
      document.querySelector('#runCell').addEventListener('click', () => {
        if (state.runAction) state.runAction();
      });
    }

    function mountSimulator(type) {
      state.runAction = null;
      if (type === 'intro') mountIntro();
      if (type === 'array') mountArray();
      if (type === 'zones') mountZones();
      if (type === 'series') mountSeries();
      if (type === 'select') mountSelect();
      if (type === 'filter') mountFilter();
      if (type === 'sort') mountSort();
      if (type === 'tablework') mountTablework();
      if (type === 'missing') mountMissing();
      if (type === 'line') mountLine();
      if (type === 'charts') mountCharts();
      if (type === 'final') mountFinal();
    }

    function mountIntro() {
      simulatorShell(`<div class="control"><span class="label">방송 단계</span><select id="library"><option value="numpy">Numpy</option><option value="pandas">Pandas</option><option value="matplotlib">Matplotlib</option></select></div>`);
      state.runAction = () => {
        const value = document.querySelector('#library').value;
        const info = {
          numpy:['현장 숫자 빠르게 계산','대기 시간 열 개 → 합계 325분','계산 결과를 다음 표 단계로 보냅니다.'],
          pandas:['부스 상황판에서 찾기','축제부스표 → 조건에 맞는 부스만 선택','정리한 표를 그래프로 보냅니다.'],
          matplotlib:['숫자를 방송 화면으로 번역','부스별 판매 개수 → 막대 높이','그래프에서 사실과 한계를 읽습니다.']
        }[value];
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>도구</span><strong>${value}</strong></div><div class="metric"><span>핵심 역할</span><strong>${info[0]}</strong></div><div class="metric"><span>다음 단계</span><strong>연결</strong></div></div><p>${info[1]}</p><p class="caption">${info[2]}</p>`;
      };
    }

    function mountArray() {
      simulatorShell(`<div class="control"><label for="arrayRows">놓는 모양</label><select id="arrayRows"><option value="1">한 줄에 10개 (1행 10열)</option><option value="2" selected>두 줄에 5개씩 (2행 5열)</option><option value="5">다섯 줄에 2개씩 (5행 2열)</option><option value="10">열 줄에 1개씩 (10행 1열)</option></select></div>`);
      state.runAction = () => {
        const rows = Number(document.querySelector('#arrayRows').value);
        const columns = 10 / rows;
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>놓는 모양</span><strong>${rows}줄 × ${columns}개</strong></div><div class="metric"><span>기록 수</span><strong>10개</strong></div><div class="metric"><span>전체 합</span><strong>325분</strong></div></div><div class="array-grid" style="grid-template-columns:repeat(${columns},minmax(36px,1fr))">${Array.from({length:10},(_,index) => `<div class="array-cell" style="animation-delay:${index * 25}ms">${10 + index * 5}</div>`).join('')}</div><p class="caption">컴퓨터에서는 이 모양을 ${rows}행 ${columns}열이라고 부릅니다. 놓는 모양이 바뀌어도 10개 기록과 전체 합 325분은 그대로입니다.</p>`;
      };
    }

    function mountZones() {
      const values = Object.entries(구역방문객).map(([구역, 방문객수]) => [구역, ...방문객수]);
      simulatorShell(`<div class="control" style="flex:1"><span class="label">세 번의 방문객 기록을 바꿔 보고 다시 실행</span><div class="score-inputs"><strong>구역</strong><strong>취재1</strong><strong>취재2</strong><strong>취재3</strong>${values.map(row => `<strong>${row[0]}</strong>${row.slice(1).map((value,index) => `<input type="number" min="0" max="300" value="${value}" data-zone="${row[0]}" data-index="${index}" aria-label="${row[0]} 구역 ${index + 1}차 방문객 수">`).join('')}`).join('')}</div></div>`);
      state.runAction = () => {
        const rows = Object.keys(구역방문객).map(zone => {
          const visitors = [...document.querySelectorAll(`[data-zone="${zone}"]`)].map(input => Number(input.value));
          return {구역:zone, 합계:sum(visitors), 평균:mean(visitors).toFixed(2)};
        });
        const top = [...rows].sort((a,b) => b.합계 - a.합계)[0];
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row">${rows.map(row => `<div class="metric"><span>${row.구역} 평균</span><strong>${row.평균}명</strong></div>`).join('')}</div>${tableHtml(rows,['구역','합계','평균'])}<p class="caption">세 번의 기록 안에서는 ${top.구역} 구역의 합계가 ${top.합계}명으로 가장 큽니다.</p>`;
      };
    }

    function mountSeries() {
      simulatorShell(`<div class="control"><label for="seriesMode">찾는 방식</label><select id="seriesMode"><option value="loc">loc: 이름표</option><option value="iloc">iloc: 자리 번호</option></select></div><div class="control"><label for="seriesKey">찾을 값</label><select id="seriesKey"></select></div>`);
      const mode = document.querySelector('#seriesMode');
      const key = document.querySelector('#seriesKey');
      function setKeys() {
        const values = mode.value === 'loc' ? 시간대별축제소식수값.map(row => row.이름표) : [0,1,2,3,4];
        key.innerHTML = values.map(value => `<option>${value}</option>`).join('');
      }
      mode.addEventListener('change', setKeys);
      setKeys();
      state.runAction = () => {
        const labels = 시간대별축제소식수값.map(row => row.이름표);
        const values = 시간대별축제소식수값.map(row => row.축제소식수);
        const index = mode.value === 'loc' ? labels.indexOf(key.value) : Number(key.value);
        document.querySelector('#simOutput').innerHTML = `<h4 class="output-title">${mode.value}[${mode.value === 'loc' ? `'${key.value}'` : key.value}] → ${values[index]}건</h4>${tableHtml(시간대별축제소식수값,['이름표','자리','축제소식수'],index)}<p class="caption">loc는 시간 이름표 ${labels[index]}, iloc는 자리 ${index}를 사용해 같은 축제 소식 수 ${values[index]}건을 찾습니다.</p>`;
      };
    }

    function mountSelect() {
      const 이름표비교부스표 = [
        {행이름표:2, 자리:0, 부스이름:'먹거리'},
        {행이름표:5, 자리:1, 부스이름:'사진관'},
        {행이름표:8, 자리:2, 부스이름:'미니게임'}
      ];
      simulatorShell(`<div class="control" style="min-width:min(360px,100%)"><label for="selectQuery">선택할 코드</label><select id="selectQuery"><option value="compare">기본 표 — 같은 결과, 다른 기준</option><option value="different">이름표 2·5·8 — 서로 다른 결과</option><option value="row">loc[2] — 2라는 이름표의 행</option><option value="cell">loc[3, '대기시간분'] — 한 칸</option><option value="column">loc[:, '부스이름'] — 한 열</option><option value="all">loc[:, :] — 전체</option><option value="slice">loc[:2, :'대기시간분'] — 범위</option></select></div>`);
      state.runAction = () => {
        const query = document.querySelector('#selectQuery').value;
        let html = '';
        if (query === 'compare') html = `<div class="metric-row"><div class="metric"><span>loc[2]</span><strong>이름표 2</strong></div><div class="metric"><span>iloc[2]</span><strong>세 번째 자리</strong></div></div>${tableHtml([축제부스표[2]],['인덱스','부스번호','부스이름','대기시간분','만족도'])}<p class="caption">지금은 행 이름표가 0, 1, 2처럼 자리 번호와 같아 결과도 같습니다. loc는 이름표, iloc는 0부터 세는 자리로 찾습니다.</p>`;
        if (query === 'different') html = `<div class="metric-row"><div class="metric"><span>loc[2] · 이름표 2</span><strong>먹거리</strong></div><div class="metric"><span>iloc[2] · 세 번째 자리</span><strong>미니게임</strong></div></div>${tableHtml(이름표비교부스표,['행이름표','자리','부스이름'])}<p class="caption">행 이름표가 2, 5, 8이면 이름표 2는 첫째 행에 있지만, 0부터 센 2번 자리는 셋째 행입니다. 그래서 두 결과가 달라집니다.</p>`;
        if (query === 'row') html = tableHtml([축제부스표[2]],['인덱스','부스번호','부스이름','대기시간분','만족도']);
        if (query === 'cell') html = `<div class="metric"><span>인덱스 3 · 대기시간분</span><strong>14분</strong></div>`;
        if (query === 'column') html = tableHtml(축제부스표.map(row => ({부스이름:row.부스이름})),['부스이름']);
        if (query === 'all') html = tableHtml(축제부스표,['인덱스','부스번호','부스이름','대기시간분','만족도']);
        if (query === 'slice') html = tableHtml(축제부스표.slice(0,3).map(row => ({인덱스:row.인덱스,부스번호:row.부스번호,부스이름:row.부스이름,대기시간분:row.대기시간분})),['인덱스','부스번호','부스이름','대기시간분']);
        document.querySelector('#simOutput').innerHTML = html;
      };
    }

    function mountFilter() {
      simulatorShell(`<div class="control" style="min-width:min(430px,100%)"><label for="filterPreset">조건</label><select id="filterPreset"><option value="wait">대기시간분 > 15</option><option value="rating">만족도 >= 4.5</option><option value="and">대기시간분 >= 15 & 만족도 >= 4.4</option><option value="or">대기시간분 >= 15 | 만족도 >= 4.6</option></select></div>`);
      state.runAction = () => {
        const preset = document.querySelector('#filterPreset').value;
        const tests = {
          wait:row => row.대기시간분 > 15,
          rating:row => row.만족도 >= 4.5,
          and:row => row.대기시간분 >= 15 && row.만족도 >= 4.4,
          or:row => row.대기시간분 >= 15 || row.만족도 >= 4.6
        };
        const result = 축제부스표.filter(tests[preset]);

        if (method === 'row') { rows = rows.filter(row => row.점심 !== null); note = '미니게임 행이 사라져 부스 수가 4개에서 3개로 줄었습니다.'; }

    function setupCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(320, rect.width || 640);
      const height = 310;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      const context = canvas.getContext('2d');
      context.scale(ratio, ratio);
      context.clearRect(0,0,width,height);
      context.font = '14px NanumSquareRound, sans-serif';
      context.lineWidth = 2;
      return {context,width,height};
    }

    function drawAxes(context,width,height,xLabel,yLabel) {
      context.strokeStyle = '#93a1ad';
      context.beginPath(); context.moveTo(48,18); context.lineTo(48,height-45); context.lineTo(width-20,height-45); context.stroke();
      context.fillStyle = '#2c3a47';
      context.fillText(yLabel,10,18);
      context.fillText(xLabel,width-62,height-12);
    }

    function drawLine(canvas, values) {
      const {context,width,height} = setupCanvas(canvas);
      drawAxes(context,width,height,'기록 순서','대기 시간');
      const max = Math.max(...values,30);
      const points = values.map((value,index) => ({x:65 + index * (width-105)/(values.length-1), y:height-55 - value/max*(height-95)}));
      context.strokeStyle = '#3155c6'; context.lineWidth = 4; context.beginPath();
      points.forEach((point,index) => index ? context.lineTo(point.x,point.y) : context.moveTo(point.x,point.y)); context.stroke();
      points.forEach((point,index) => { context.fillStyle='#ffd447'; context.strokeStyle='#15212e'; context.lineWidth=2; context.beginPath(); context.arc(point.x,point.y,7,0,Math.PI*2); context.fill(); context.stroke(); context.fillStyle='#15212e'; context.fillText(String(index),point.x-4,height-27); context.fillText(String(values[index]),point.x-4,point.y-12); });
    }

    function drawSelectedChart(canvas,type) {
      const {context,width,height} = setupCanvas(canvas);
      if (type === 'bar') {
        const labels=['먹거리','사진관','미니게임','음료'], values=[95,70,82,105];
        drawAxes(context,width,height,'부스','판매');
        const slot=(width-85)/labels.length;
        values.forEach((value,index) => { const x=57+index*slot, barHeight=value/110*(height-90); context.fillStyle=['#00a7c4','#3155c6','#ffd447','#ef6253'][index]; context.fillRect(x,height-45-barHeight,Math.max(38,slot-28),barHeight); context.fillStyle='#15212e'; context.fillText(labels[index],x,height-20); context.fillText(String(value),x,height-53-barHeight); });
      }
      if (type === 'scatter') {
        const xs=[2,3,1,5,4], ys=[30,18,40,10,14];
        drawAxes(context,width,height,'운영 인원','대기 시간');
        xs.forEach((value,index) => { const x=58+value/6*(width-92), y=height-48-ys[index]/45*(height-78); context.fillStyle='#ef6253'; context.strokeStyle='#15212e'; context.beginPath(); context.arc(x,y,8,0,Math.PI*2); context.fill(); context.stroke(); context.fillStyle='#15212e'; context.fillText(`(${value},${ys[index]})`,x+8,y-8); });
      }
      if (type === 'mixed') {
        const labels=['먹거리','사진관','미니게임','음료','책갈피'], morning=[42,28,35,31,24], afternoon=[58,40,52,49,36];
        drawAxes(context,width,height,'부스','방문객');
        const slot=(width-84)/labels.length;
        afternoon.forEach((value,index) => { const x=55+index*slot, h=value/65*(height-88); context.fillStyle='rgba(0,167,196,.65)'; context.fillRect(x,height-45-h,Math.max(28,slot-28),h); context.fillStyle='#15212e'; context.fillText(labels[index],x,height-20); });
        context.strokeStyle='#238b57'; context.lineWidth=4; context.beginPath();
        morning.forEach((value,index) => { const x=55+index*slot+Math.max(28,slot-28)/2, y=height-45-value/65*(height-88); index ? context.lineTo(x,y) : context.moveTo(x,y); }); context.stroke();
        context.fillStyle='#238b57'; context.fillText('오전 선',60,22); context.fillStyle='#007f95'; context.fillText('오후 막대',130,22);
      }
      if (type === 'box') {
        const values=[8,12,18,25,7,14,9,21,16,11].sort((a,b)=>a-b);
        const min=values[0], q1=9.5, median=13, q3=17.5, max=values[values.length-1];
        const scale=value => 55+(value-5)/22*(width-100);
        context.strokeStyle='#15212e'; context.lineWidth=3; const y=145;
        context.beginPath(); context.moveTo(scale(min),y); context.lineTo(scale(max),y); context.stroke();
        context.fillStyle='rgba(0,167,196,.35)'; context.fillRect(scale(q1),y-45,scale(q3)-scale(q1),90); context.strokeRect(scale(q1),y-45,scale(q3)-scale(q1),90);
        [min,median,max].forEach(value => { context.beginPath(); context.moveTo(scale(value),y-48); context.lineTo(scale(value),y+48); context.stroke(); context.fillStyle='#15212e'; context.fillText(String(value),scale(value)-9,y+72); });
        context.fillText('최솟값',scale(min)-20,62); context.fillText('중앙값',scale(median)-22,62); context.fillText('최댓값',scale(max)-20,62);
      }
    }

    function renderQuiz(question, container, compact) {
      if (!question) return;
      const saved = answersForCurrentMode()[question.id];
      container.innerHTML = `<div class="quiz-card"><span class="difficulty ${levelClass(question.level)}">${question.level}</span><h4 class="quiz-question">${escapeHtml(question.prompt)}</h4><div class="choices">${question.choices.map((choice,index) => `<label class="choice"><input type="radio" name="quiz-${question.id}" value="${index}" ${saved && saved.selected === index ? 'checked' : ''}><span><strong>${String.fromCharCode(65+index)}.</strong> ${escapeHtml(choice[0])}</span></label>`).join('')}</div><div class="quiz-actions"><button type="button" class="primary-btn" data-check="${question.id}">정답 확인</button>${state.mode === '수업' ? `<button type="button" class="secondary-btn" data-reveal="${question.id}">교사용 해설</button>` : ''}</div><div id="feedback-${question.id}"></div></div>`;
      container.querySelector(`[data-check="${question.id}"]`).addEventListener('click', () => checkQuiz(question, container, compact));
      const reveal = container.querySelector(`[data-reveal="${question.id}"]`);
      if (reveal) reveal.addEventListener('click', () => showFeedback(question, question.answer, container, true));
      if (saved) showFeedback(question, saved.selected, container, false);
    }

    function checkQuiz(question, container, compact) {
      const selected = container.querySelector(`input[name="quiz-${question.id}"]:checked`);
      if (!selected) { announce('답을 하나 고른 뒤 확인해 주세요.'); return; }
      const selectedIndex = Number(selected.value);
      answersForCurrentMode()[question.id] = {selected:selectedIndex, correct:selectedIndex === question.answer};
      showFeedback(question, selectedIndex, container, false);
      if (!compact && state.mode === '평가') {
        const correctCount = questions.filter(item => state.assessmentAnswers[item.id]?.correct).length;
        const answeredCount = questions.filter(item => state.assessmentAnswers[item.id]).length;
        const score = document.querySelector('.score-big');
        const responseCount = document.querySelector('#responseCount');
        if (score) score.textContent = `${correctCount} / ${questions.length}`;
        if (responseCount) responseCount.textContent = `응답 ${answeredCount}문항`;
        updateChrome();
      }
    }

    function showFeedback(question, selectedIndex, container, teacherReveal) {
      const correct = selectedIndex === question.answer;
      const feedback = container.querySelector(`#feedback-${question.id}`);
      if (!feedback) return;
      const detailed = teacherReveal || state.mode !== '수업';
      const detailHtml = detailed ? `<ol class="solution-steps">${question.steps.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol><div class="daily-example"><strong>생활 속 예시로 다시 보기</strong>${escapeHtml(question.daily)}</div><p><strong>모범 답안:</strong> ${escapeHtml(question.model)}</p><div class="choice-review">${question.choices.map((choice,index) => `<div class="review-row ${index === question.answer ? 'answer' : ''}"><strong>${String.fromCharCode(65+index)}. ${index === question.answer ? '정답' : '오답'}</strong> — ${escapeHtml(choice[1])}</div>`).join('')}</div>` : `<p class="caption">${correct ? '정답의 핵심 근거를 학생의 말로 한 문장으로 설명해 보세요.' : '선택지 설명에서 잘못 연결된 부분을 찾은 뒤 다시 선택해 보세요.'}</p>`;
      const view = teacherReveal ? 'teacher' : detailed ? 'learner-detailed' : 'classroom-check';
      feedback.innerHTML = `<div class="feedback ${correct ? 'correct' : 'wrong'}" data-feedback-view="${view}"><h4>${teacherReveal ? '교사용 모범 해설' : correct ? '정답입니다.' : '선택을 다시 짚어 봅시다.'}</h4><p><strong>${teacherReveal ? '정답' : '선택한 답'}:</strong> ${String.fromCharCode(65+selectedIndex)}. ${escapeHtml(question.choices[selectedIndex][0])}</p><p>${escapeHtml(question.choices[selectedIndex][1])}</p>${detailHtml}</div>`;
      feedback.scrollIntoView({behavior:'smooth',block:'nearest'});
    }

    function renderAssessment() {
      const answered = Object.keys(state.assessmentAnswers).filter(id => questions.some(question => question.id === id));
      const correctCount = questions.filter(question => state.assessmentAnswers[question.id]?.correct).length;
      const question = questions[state.assessmentIndex];
      content.innerHTML = `<section class="assessment-shell"><div class="assessment-main"><span class="eyebrow">총괄 점검 · 쉬움 4 + 중간 4 + 어려움 4</span><h2>데이터 방송국 자격 평가</h2><p class="assessment-sub">답을 고르면 풀이 과정과 모든 선택지의 오답 이유가 열립니다. 점수보다 어떤 생각에서 틀렸는지 확인하는 것이 목표입니다.</p><div class="assessment-panel" id="assessmentQuestion"></div></div><aside class="assessment-side"><div><span>현재 점수</span><strong class="score-big">${correctCount} / 12</strong><small id="responseCount">응답 ${answered.length}문항</small></div><div class="question-map">${questions.map((item,index) => `<button type="button" class="question-dot ${index === state.assessmentIndex ? 'active' : ''} ${state.assessmentAnswers[item.id] ? 'done' : ''}" data-question="${index}" aria-label="${index + 1}번 문제">${index + 1}</button>`).join('')}</div><button type="button" class="secondary-btn" id="finishAssessment">평가 결과 보기</button><button type="button" class="secondary-btn" id="resetAssessment">응답 초기화</button></aside></section>`;
      const panel = document.querySelector('#assessmentQuestion');
      if (state.assessmentFinished) {
        const percent = Math.round(correctCount / questions.length * 100);
        const message = percent >= 85 ? '개념·코드·해석을 안정적으로 연결했습니다.' : percent >= 60 ? '핵심은 잡았습니다. 틀린 문항의 오답 이유를 다시 읽어 보세요.' : '쉬움 문제부터 코드 결과를 손으로 따라가며 다시 연결해 봅시다.';
        panel.innerHTML = `<div class="summary-box"><h3>평가 결과: ${correctCount} / ${questions.length} (${percent}점)</h3><p>${message}</p><p><strong>완성 기준:</strong> 변수 뜻 설명, loc/iloc·조건식 사용, 결측치 판단, 그래프 선택, 사실·근거·한계가 모두 연결되어야 합니다.</p><button type="button" class="primary-btn" id="reviewWrong">틀린 문제부터 복습</button></div>`;
        document.querySelector('#reviewWrong').addEventListener('click', () => {
          const firstWrong = questions.findIndex(item => !state.assessmentAnswers[item.id]?.correct);
          state.assessmentFinished = false;
          state.assessmentIndex = firstWrong < 0 ? 0 : firstWrong;
          renderLesson();
        });
      } else {
        renderQuiz(question,panel,false);
        const next = document.createElement('button');
        next.type='button'; next.className='secondary-btn'; next.style.marginTop='12px';
        next.textContent = state.assessmentIndex === questions.length - 1 ? '결과 보기' : '다음 문제 →';
        next.addEventListener('click', () => {
          if (state.assessmentIndex === questions.length - 1) state.assessmentFinished = true;
          else state.assessmentIndex += 1;
          renderLesson();
        });
        panel.appendChild(next);
      }
      document.querySelectorAll('[data-question]').forEach(button => button.addEventListener('click', () => { state.assessmentFinished=false; state.assessmentIndex=Number(button.dataset.question); renderLesson(); }));
      document.querySelector('#finishAssessment').addEventListener('click', () => { state.assessmentFinished=true; renderLesson(); });
      document.querySelector('#resetAssessment').addEventListener('click', () => { state.assessmentAnswers={}; state.assessmentIndex=0; state.assessmentFinished=false; renderLesson(); });
      renderNav();
    }

    function updateChrome() {
      const progress = state.mode === '평가' ? ((state.assessmentIndex + 1) / questions.length) * 100 : ((state.lesson + 1) / lessons.length) * 100;
      document.querySelector('#progressFill').style.width = `${progress}%`;
      document.querySelector('#stepStatus').textContent = state.mode === '평가' ? `평가 ${state.assessmentIndex + 1} / ${questions.length}` : `${state.lesson + 1} / ${lessons.length}`;
      document.querySelector('#prevLesson').disabled = state.mode === '평가' ? state.assessmentIndex === 0 : state.lesson === 0;
      document.querySelector('#nextLesson').disabled = state.mode === '평가' ? state.assessmentIndex === questions.length - 1 : state.lesson === lessons.length - 1;
      document.querySelectorAll('[data-mode]').forEach(button => {
        const isActive = button.dataset.mode === state.mode;
        button.classList.toggle('active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });
    }

    function goLesson(index) {
      state.lesson = Math.max(0,Math.min(lessons.length-1,index));
      if (state.mode === '평가') state.mode = '수업';
      renderLesson();
      content.focus({preventScroll:true});
      window.scrollTo({top:0,behavior:'smooth'});
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); announce('코드를 클립보드에 복사했습니다.'); }
      catch { announce('브라우저에서 복사가 제한되었습니다. 코드 영역을 선택해 주세요.'); }
    }

    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      state.mode = button.dataset.mode;
      state.assessmentFinished = false;
      renderLesson();
      announce(state.mode === '연습' ? '연습 모드: 예상하고 실행한 뒤 문제를 풉니다.' : state.mode === '평가' ? '평가 모드: 12문항을 차례로 풉니다.' : '수업 모드: 개념과 교사용 진행 포인트를 함께 봅니다.');
      content.focus({preventScroll:true});
      window.scrollTo({top:0, behavior:'smooth'});
    }));
    document.querySelector('#prevLesson').addEventListener('click', () => {
      if (state.mode === '평가') { state.assessmentIndex=Math.max(0,state.assessmentIndex-1); renderLesson(); }
      else goLesson(state.lesson-1);
    });
    document.querySelector('#nextLesson').addEventListener('click', () => {
      if (state.mode === '평가') { state.assessmentIndex=Math.min(questions.length-1,state.assessmentIndex+1); renderLesson(); }
      else goLesson(state.lesson+1);
    });
    document.querySelector('#fontDown').addEventListener('click', () => { state.fontSize=Math.max(14,state.fontSize-1); document.documentElement.style.setProperty('--base-size',`${state.fontSize}px`); announce(`글자 크기 ${state.fontSize}`); });
    document.querySelector('#fontUp').addEventListener('click', () => { state.fontSize=Math.min(22,state.fontSize+1); document.documentElement.style.setProperty('--base-size',`${state.fontSize}px`); announce(`글자 크기 ${state.fontSize}`); });
    document.querySelector('#fullscreen').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
        else announce('이 브라우저에서는 전체 화면을 지원하지 않습니다.');
      } catch {
        announce('전체 화면이 제한되었습니다. 브라우저 메뉴의 전체 화면을 이용해 주세요.');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const button = document.querySelector('#fullscreen');
      const isFullscreen = Boolean(document.fullscreenElement);
      button.setAttribute('aria-label', isFullscreen ? '전체 화면 닫기' : '전체 화면');
      button.title = isFullscreen ? '전체 화면 닫기' : '전체 화면';
    });
    window.addEventListener('resize', () => {
      const canvas = document.querySelector('#lessonChart');
      if (canvas && state.runAction) state.runAction();
    });
    document.addEventListener('keydown', event => {
      if (event.target.matches('input, select')) return;
      if (event.key === 'ArrowRight' && state.mode !== '평가') goLesson(state.lesson+1);
      if (event.key === 'ArrowLeft' && state.mode !== '평가') goLesson(state.lesson-1);
    });

    renderLesson();
  </script>
</body>
</html>
