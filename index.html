<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15212e">
  <link rel="icon" href="data:,">
  <title>2026 데이터 과학 수업 전자칠판</title>
  <style>
    :root {
      --ink: #15212e;
      --ink-2: #2c3a47;
      --paper: #fffdf7;
      --white: #ffffff;
      --mist: #eef3f4;
      --line: #cbd5d8;
      --cyan: #00a7c4;
      --blue: #3155c6;
      --yellow: #ffd447;
      --coral: #ef6253;
      --green: #238b57;
      --code: #111a24;
      --shadow: 0 8px 0 rgba(21, 33, 46, .12);
      --radius: 8px;
      --base-size: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background-color: var(--mist);
      background-image:
        linear-gradient(rgba(21, 33, 46, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(21, 33, 46, .045) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: "NanumSquareRound", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      font-size: var(--base-size);
      letter-spacing: 0;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    pre, code { word-break: normal; overflow-wrap: normal; }
    button, input, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 4px solid rgba(0, 167, 196, .3);
      outline-offset: 2px;
    }
    .skip-link {
      position: fixed;
      z-index: 100;
      top: 8px;
      left: 8px;
      transform: translateY(-140%);
      padding: 10px 14px;
      color: var(--white);
      background: var(--ink);
    }
    .skip-link:focus { transform: translateY(0); }
    .app { min-height: 100vh; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
    .topbar {
      position: sticky;
      z-index: 30;
      top: 0;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto auto;
      align-items: center;
      gap: 14px;
      min-height: 76px;
      padding: 10px clamp(14px, 3vw, 34px);
      color: var(--white);
      background: var(--ink);
      border-bottom: 5px solid var(--yellow);
    }
    .brand { min-width: 0; }
    .brand-kicker {
      display: block;
      margin-bottom: 2px;
      color: var(--yellow);
      font-size: .76rem;
      font-weight: 800;
    }
    .brand h1 {
      margin: 0;
      overflow: hidden;
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .mode-switch {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      border: 2px solid rgba(255,255,255,.32);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .mode-switch button {
      min-height: 38px;
      padding: 6px 12px;
      color: var(--white);
      background: transparent;
      border: 0;
      border-right: 1px solid rgba(255,255,255,.26);
      font-weight: 800;
    }
    .mode-switch button:last-child { border-right: 0; }
    .mode-switch button.active { color: var(--ink); background: var(--yellow); }
    .top-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--white);
      background: transparent;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: var(--radius);
      font-weight: 900;
    }
    .icon-btn:hover { background: rgba(255,255,255,.12); }
    .progress-track {
      grid-column: 1 / -1;
      height: 5px;
      margin: 0 -4px -4px;
      overflow: hidden;
      background: rgba(255,255,255,.18);
    }
    .progress-fill {
      width: 8%;
      height: 100%;
      background: var(--cyan);
      transition: width .45s ease;
    }
    .layout {
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      align-items: start;
      gap: 18px;
      width: min(1760px, 100%);
      margin: 0 auto;
      padding: 18px clamp(12px, 2.4vw, 30px) 34px;
    }
    .sidebar {
      position: sticky;
      top: 94px;
      max-height: calc(100vh - 188px);
      overflow: auto;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .story-card {
      padding: 16px;
      background: var(--yellow);
      border-bottom: 2px solid var(--ink);
    }
    .story-card strong { display: block; margin-bottom: 7px; font-size: 1.05rem; }
    .story-card p { margin: 0; font-size: .88rem; line-height: 1.55; }
    .lesson-nav { display: grid; padding: 8px; }
    .lesson-btn {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 6px 8px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    .lesson-btn:last-child { border-bottom: 0; }
    .lesson-btn:hover { background: var(--mist); }
    .lesson-btn.active { background: var(--ink); color: var(--white); }
    .lesson-number {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      color: var(--ink);
      background: var(--yellow);
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: .78rem;
      font-weight: 900;
    }
    .lesson-btn.active .lesson-number { color: var(--ink); }
    .lesson-name { min-width: 0; font-size: .88rem; font-weight: 800; line-height: 1.25; }
    .content { min-width: 0; }
    .stage-head {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      padding: clamp(20px, 3vw, 34px);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius) var(--radius) 0 0;
      overflow: hidden;
    }
    .stage-head::after {
      content: "";
      position: absolute;
      right: -28px;
      bottom: -28px;
      width: 130px;
      height: 70px;
      background: var(--cyan);
      border: 2px solid var(--ink);
      transform: rotate(-12deg);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--blue);
      font-size: .8rem;
      font-weight: 900;
    }
    .stage-head h2 {
      max-width: 900px;
      margin: 0 0 10px;
      font-size: clamp(1.55rem, 3vw, 2.65rem);
      line-height: 1.12;
    }
    .stage-head p { max-width: 880px; margin: 0; color: var(--ink-2); line-height: 1.65; }
    .stage-head.practice-stage {
      color: var(--ink);
      background: #e8f7fa;
      border-color: var(--blue);
    }
    .stage-head.practice-stage::after { background: var(--yellow); border-color: var(--blue); }
    .practice-stage .eyebrow { color: var(--coral); }
    .practice-stage .stage-badge { background: var(--blue); transform: rotate(-2deg); }
    .stage-badge {
      position: relative;
      z-index: 1;
      align-self: start;
      min-width: 112px;
      padding: 10px 12px;
      color: var(--white);
      background: var(--coral);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      text-align: center;
      font-weight: 900;
      transform: rotate(2deg);
    }
    .story-rail {
      display: grid;
      grid-template-columns: minmax(150px, .7fr) repeat(3, minmax(0, 1fr));
      background: var(--white);
      border-right: 2px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      border-left: 2px solid var(--ink);
    }
    .story-phase {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      padding: 15px 18px;
      color: var(--white);
      background: var(--ink);
    }
    .story-phase span {
      color: var(--yellow);
      font-size: .72rem;
      font-weight: 900;
    }
    .story-phase strong { font-size: .98rem; line-height: 1.35; }
    .story-beat {
      min-width: 0;
      padding: 14px 16px;
      border-left: 1px solid var(--line);
      line-height: 1.55;
    }
    .story-beat strong {
      display: block;
      margin-bottom: 5px;
      color: var(--blue);
      font-size: .76rem;
    }
    .story-beat span { display: block; font-size: .88rem; }
    .story-beat.mission {
      background: #fff8d7;
      box-shadow: inset 0 4px 0 var(--yellow);
    }
    .story-beat.next { background: #edf8f3; }
    .practice-mode .story-rail {
      border-right-color: var(--blue);
      border-bottom-color: var(--blue);
      border-left-color: var(--blue);
    }
    .practice-mode .story-phase { background: var(--blue); }
    .practice-brief {
      display: grid;
      grid-template-columns: auto repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: 10px;
      padding: 12px clamp(18px, 3vw, 34px);
      color: var(--white);
      background: var(--ink);
      border-right: 2px solid var(--blue);
      border-left: 2px solid var(--blue);
    }
    .practice-brief > strong { color: var(--yellow); font-size: .9rem; }
    .practice-step { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: .82rem; font-weight: 800; }
    .practice-step b {
      display: inline-grid;
      flex: 0 0 26px;
      place-items: center;
      width: 26px;
      height: 26px;
      color: var(--ink);
      background: var(--yellow);
      border-radius: 50%;
    }
    .lesson-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(310px, .82fr);
      gap: 0;
      background: var(--white);
      border: 2px solid var(--ink);
      border-top: 0;
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }
    .practice-mode .lesson-grid { border-color: var(--blue); }
    .practice-layout .simulator-band { background: #f2fbfd; }
    .practice-layout .quiz-band { background: #fffbed; }
    .main-column { min-width: 0; border-right: 2px solid var(--ink); }
    .side-column { min-width: 0; background: #f8faf9; }
    .band { padding: clamp(18px, 2.4vw, 28px); border-bottom: 2px solid var(--ink); }
    .band:last-child { border-bottom: 0; }
    .band-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      font-size: 1.06rem;
    }
    .band-index {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-size: .78rem;
    }
    .concept-text { line-height: 1.7; }
    .concept-text p { margin: 0 0 11px; }
    .concept-section + .concept-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .concept-section h4 {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: .96rem;
    }
    .concept-section p { margin: 0; }
    .concept-text ul { margin: 8px 0 0; padding-left: 21px; }
    .concept-text li { margin: 5px 0; }
    .key-list { display: grid; gap: 8px; margin-top: 14px; }
    .key-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      padding: 10px 12px;
      background: var(--mist);
      border-left: 5px solid var(--cyan);
    }
    .key-item code { color: var(--blue); font-weight: 900; }
    .life-example {
      margin-top: 14px;
      padding: 13px 14px;
      background: #fff8d7;
      border-left: 6px solid var(--yellow);
      line-height: 1.68;
    }
    .life-example strong { display: block; margin-bottom: 4px; }
    .code-shell { overflow: hidden; background: var(--code); border: 2px solid var(--ink); border-radius: var(--radius); }
    .code-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 42px;
      padding: 7px 9px 7px 13px;
      color: #c7d2de;
      background: #23303d;
      border-bottom: 1px solid #42505f;
      font-size: .78rem;
    }
    .code-toolbar strong { color: var(--yellow); }
    .copy-btn {
      min-height: 30px;
      padding: 4px 9px;
      color: var(--white);
      background: transparent;
      border: 1px solid #687788;
      border-radius: 6px;
    }
    pre {
      max-height: 430px;
      margin: 0;
      overflow: auto;
      padding: 18px;
      color: #e7edf3;
      font-family: Menlo, Monaco, "NanumGothicCoding", monospace;
      font-size: .86rem;
      line-height: 1.65;
      white-space: pre;
      tab-size: 4;
    }
    .simulator { min-height: 280px; }
    .sim-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 10px;
      padding: 14px;
      background: #e8f7fa;
      border: 2px solid var(--ink);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .control { display: grid; gap: 4px; min-width: 120px; }
    .sim-toolbar > .control { flex: 1 1 150px; min-width: 0; }
    .sim-toolbar > .control select { width: 100%; }
    .control label, .control .label { font-size: .75rem; font-weight: 900; }
    select, input[type="number"] {
      min-height: 38px;
      max-width: 100%;
      padding: 7px 9px;
      color: var(--ink);
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 6px;
    }
    input[type="range"] { width: 150px; accent-color: var(--blue); }
    .run-btn, .primary-btn, .secondary-btn {
      min-height: 40px;
      padding: 8px 14px;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      font-weight: 900;
      text-align: center;
    }
    .run-btn, .primary-btn { color: var(--white); background: var(--blue); box-shadow: 0 4px 0 var(--ink); }
    .run-btn:active, .primary-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
    .secondary-btn { color: var(--ink); background: var(--white); }
    .sim-output {
      min-height: 210px;
      overflow: auto;
      padding: 16px;
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .empty-state {
      display: grid;
      place-items: center;
      min-height: 174px;
      color: #64727f;
      text-align: center;
      line-height: 1.55;
    }
    .output-title { margin: 0 0 12px; font-size: 1rem; }
    .data-table-wrap { max-width: 100%; overflow: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { padding: 9px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
    th { color: var(--white); background: var(--ink); }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    tr.highlight td { background: #fff4b8; font-weight: 900; }
    .nan { color: var(--coral); font-weight: 900; }
    .metric-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .metric { padding: 12px; background: var(--mist); border: 2px solid var(--ink); border-radius: var(--radius); }
    .metric span { display: block; margin-bottom: 4px; color: #566471; font-size: .74rem; font-weight: 800; }
    .metric strong { font-size: 1.5rem; }
    .array-grid { display: grid; gap: 5px; max-width: 620px; }
    .array-cell { display: grid; place-items: center; min-height: 48px; background: var(--yellow); border: 2px solid var(--ink); font-weight: 900; animation: pop .28s both; }
    .score-inputs { display: grid; grid-template-columns: 70px repeat(3, minmax(64px, 1fr)); gap: 6px; align-items: center; }
    .score-inputs strong { font-size: .8rem; }
    .score-inputs input { width: 100%; }
    .chart-wrap { min-height: 320px; overflow-x: auto; }
    canvas { display: block; width: 100%; min-width: 320px; height: 310px; background: var(--white); }
    .chart-wrap.grouped-chart canvas { min-width: 480px; }
    .caption { margin: 10px 0 0; color: #566471; font-size: .82rem; line-height: 1.55; }
    .teacher-tip { padding: 14px; background: #e8f7ef; border-left: 6px solid var(--green); line-height: 1.6; }
    .teacher-tip strong { display: block; margin-bottom: 5px; }
    .practice-mode .teacher-only { display: none; }
    .quiz-card { padding: 0; }
    .difficulty {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      color: var(--ink);
      background: var(--yellow);
      border: 1px solid var(--ink);
      border-radius: 5px;
      font-size: .74rem;
      font-weight: 900;
    }
    .difficulty.medium { color: var(--white); background: var(--cyan); }
    .difficulty.hard { color: var(--white); background: var(--coral); }
    .quiz-question { margin: 0 0 14px; font-size: 1rem; line-height: 1.6; }
    .choices { display: grid; gap: 8px; }
    .choice {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      min-height: 44px;
      padding: 10px;
      background: var(--white);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      line-height: 1.45;
    }
    .choice:hover { border-color: var(--cyan); }
    .choice:has(input:checked) { border-color: var(--blue); background: #edf1ff; }
    .choice input { margin-top: 3px; accent-color: var(--blue); }
    .quiz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .feedback { margin-top: 14px; padding: 14px; border: 2px solid var(--ink); border-radius: var(--radius); line-height: 1.62; animation: rise .3s ease both; }
    .feedback.correct { background: #e8f7ef; border-left: 8px solid var(--green); }
    .feedback.wrong { background: #fff0ed; border-left: 8px solid var(--coral); }
    .feedback h4 { margin: 0 0 8px; }
    .daily-example {
      margin: 12px 0;
      padding: 12px 13px;
      background: #eef7ff;
      border-left: 6px solid var(--blue);
      line-height: 1.68;
    }
    .daily-example strong { display: block; margin-bottom: 4px; color: var(--blue); }
    .solution-steps { margin: 9px 0; padding-left: 21px; }
    .choice-review { display: grid; gap: 6px; margin-top: 12px; }
    .review-row { padding: 9px; background: rgba(255,255,255,.72); border-left: 4px solid var(--line); font-size: .86rem; }
    .review-row.answer { border-left-color: var(--green); }
    .assessment-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 270px;
      gap: 18px;
      padding: clamp(18px, 3vw, 34px);
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .assessment-main { min-width: 0; }
    .assessment-main h2 { margin: 0 0 8px; font-size: clamp(1.55rem, 3vw, 2.45rem); }
    .assessment-sub { margin: 0 0 22px; color: #566471; line-height: 1.6; }
    .assessment-panel { padding: 20px; background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius); }
    .assessment-side { align-self: start; padding: 18px; color: var(--white); background: var(--ink); border-radius: var(--radius); }
    .score-big { display: block; margin: 8px 0 2px; color: var(--yellow); font-size: 2.6rem; font-weight: 900; }
    .question-map { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 18px 0; }
    .question-dot { min-height: 36px; padding: 4px; color: var(--white); background: transparent; border: 1px solid #72808d; border-radius: 5px; }
    .question-dot.active { color: var(--ink); background: var(--yellow); border-color: var(--yellow); }
    .question-dot.done { background: var(--green); border-color: var(--green); }
    .assessment-side .secondary-btn { width: 100%; margin-top: 8px; }
    .summary-box { padding: 20px; background: #e8f7ef; border: 2px solid var(--ink); border-radius: var(--radius); line-height: 1.65; }
    .bottom-nav {
      position: fixed;
      z-index: 25;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr minmax(180px, 420px) 1fr;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 9px clamp(12px, 3vw, 34px) calc(9px + env(safe-area-inset-bottom));
      color: var(--white);
      background: rgba(21, 33, 46, .97);
      border-top: 4px solid var(--cyan);
    }
    .bottom-nav button { min-height: 42px; padding: 8px 14px; color: var(--white); background: transparent; border: 1px solid #71808d; border-radius: var(--radius); font-weight: 900; }
    .bottom-nav button:hover:not(:disabled) { background: rgba(255,255,255,.11); }
    .bottom-nav button:disabled { opacity: .35; cursor: not-allowed; }
    .next-btn { justify-self: end; }
    .step-status { text-align: center; font-size: .82rem; font-weight: 800; }
    .toast {
      position: fixed;
      z-index: 80;
      right: 18px;
      bottom: 84px;
      max-width: min(390px, calc(100vw - 36px));
      padding: 11px 14px;
      color: var(--white);
      background: var(--ink);
      border: 2px solid var(--yellow);
      border-radius: var(--radius);
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: .25s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

        keys:[['언제 DataFrame?','부스처럼 여러 대상을 같은 항목으로 비교해야 할 때'],['왜 여기서 DataFrame?','부스 하나의 번호·이름·대기 시간·만족도를 한 줄에 모아 어느 부스를 도울지 판단하기 위해'],['loc[2]','2라는 행 이름표로 미니게임 찾기'],['iloc[2]','0부터 세어 세 번째 자리의 미니게임 찾기'],['이름표 [2, 5, 8]','loc[2]는 먹거리, iloc[2]는 미니게임'],['① loc[3, \'대기시간분\']','쉼표 왼쪽에서 행 이름표 3인 음료를 찾고, 오른쪽에서 대기시간분 열을 찾기 → 만나는 값은 14분'],['② loc[:, \'부스이름\']','행 자리의 콜론(:)은 모든 행이라는 뜻 → 다섯 부스의 이름만 꺼내기'],['③ loc[:2, :\'대기시간분\']','행은 처음부터 이름표 2까지, 열은 처음부터 대기시간분까지 고르기 → 끝의 2와 대기시간분도 포함']],
        code:`# 어느 부스를 먼저 도울지 판단하려면 이름·대기 시간·만족도를 함께 보아야 합니다.\n# 부스 하나의 정보를 같은 행에 모으기 위해 DataFrame을 만듭니다.\n축제부스표 = pd.DataFrame({\n    '부스번호': [101, 102, 103, 104, 105],\n    '부스이름': ['먹거리', '사진관', '미니게임', '음료', '책갈피'],\n    '대기시간분': [18, 7, 25, 14, 9],\n    '만족도': [4.2, 4.7, 4.4, 4.1, 4.6]\n})\n\n# 지금 표에서는 같은 행이 나오지만 찾는 기준은 다릅니다.\n축제부스표.loc[2]   # 2라는 행 이름표 → 미니게임\n축제부스표.iloc[2]  # 0부터 세어 세 번째 자리 → 미니게임\n\n# 행 이름표가 2, 5, 8이면 결과도 달라집니다.\n비교용부스표 = pd.DataFrame(\n    {'부스이름': ['먹거리', '사진관', '미니게임']},\n    index=[2, 5, 8]\n)\n비교용부스표.loc[2]   # 이름표 2 → 먹거리\n비교용부스표.iloc[2]  # 세 번째 자리 → 미니게임\n\n# ① 행 이름표 3인 음료를 찾고, 대기시간분 열에서 14를 꺼냅니다.\n축제부스표.loc[3, '대기시간분']\n\n# ② 행 자리의 :는 모든 행을 뜻합니다. 부스이름 열만 꺼냅니다.\n축제부스표.loc[:, '부스이름']\n축제부스표.loc[:, :]\n\n# ③ 행은 처음부터 이름표 2까지, 열은 처음부터 대기시간분까지 고릅니다.\n# loc의 범위에서는 끝 이름표 2와 끝 열 대기시간분도 포함합니다.\n축제부스표.loc[:2, :'대기시간분']`,
        tip:'먼저 “운영 본부의 질문에 부스 이름만으로 답할 수 있을까?”라고 묻습니다. 대기 시간과 만족도도 같은 부스끼리 보아야 하므로 DataFrame이 필요하다는 이유를 확인한 뒤, loc의 쉼표를 “행 먼저, 열 나중”으로 읽게 합니다.'
      },
      {

        clue:'긴 줄과 만족도 조건을 함께 따져야 하는 부스 상황판이 준비되었습니다.',
        mission:'조건식을 사용해 안내 방송이나 지원이 필요한 부스만 남깁니다.',

        example:'간식을 고를 때 “1만 원 이하이면서 별점 4점 이상”이면 두 조건 모두라서 &입니다. “매운맛이거나 치즈맛”이면 적어도 하나를 만족하면 되며, 매운맛과 치즈맛을 모두 갖춘 간식도 포함하므로 |입니다.',

        codeGuide:'이 코드는 부스마다 조건에 맞는지 먼저 확인하고, loc로 맞는 부스만 꺼냅니다. 첫째 줄은 대기 시간이 15분보다 긴 부스에 True 스티커를 붙이고, 둘째 줄은 그 부스만 남깁니다. 셋째 줄은 만족도가 4.5점 이상인 부스를 바로 고릅니다. &는 대기 시간과 만족도 조건을 모두 만족해야 통과하고, |는 둘 중 하나 이상만 만족해도 통과합니다. > 15는 15분을 빼지만, >= 15는 15분도 포함합니다.',
        code:`대기시간15분초과조건 = 축제부스표['대기시간분'] > 15\n대기15분초과부스 = 축제부스표.loc[대기시간15분초과조건]\n만족도4점5이상부스 = 축제부스표.loc[축제부스표['만족도'] >= 4.5]\n\n두조건모두부스 = 축제부스표.loc[\n    (축제부스표['대기시간분'] >= 15) & (축제부스표['만족도'] >= 4.4)\n]\n한조건이상부스 = 축제부스표.loc[\n    (축제부스표['대기시간분'] >= 15) | (축제부스표['만족도'] >= 4.6)\n]`,

        story:'앞 장에서 “대기 시간이 15분 이상이거나 만족도가 4.6점 이상인 부스”를 골랐습니다. 둘 중 한 조건 이상을 만족한 먹거리·사진관·미니게임·책갈피 네 곳이 한조건이상부스입니다. 이번에는 원본 다섯 부스를 대기 시간순으로 정렬하고, 네 후보 표는 방송 화면에서 읽기 편하도록 행과 열의 자리를 바꿉니다.',

          ['왜 여기서 긴 줄부터 놓을까요?','이번 정렬 코드는 후보표가 아니라 원본 축제부스표의 다섯 부스 전체를 대상으로 합니다. 대기 시간이 긴 순서로 놓으면 어느 부스를 먼저 살펴볼지 판단하기 쉽습니다. 네 후보만 사용하는 코드는 아래의 한조건이상부스.T입니다.'],

        example:'음악 목록을 재생 횟수가 많은 순서로 놓는 것은 정렬입니다. 세로로 적힌 시간표를 발표 화면에 맞게 가로로 다시 놓는 것은 전치와 비슷합니다. 두 경우 모두 원래 내용은 사라지지 않습니다.',

        codeGuide:'정렬 코드 두 줄은 원본 축제부스표의 다섯 부스를 대기 시간순으로 다시 놓습니다. 아래의 한조건이상부스는 앞 장에서 | 조건으로 고른 네 후보입니다. 한조건이상부스.T는 네 후보의 값은 그대로 둔 채 행과 열의 자리를 맞바꾸어 방송용세로표를 만듭니다.',

        concept:'반 성적표에 평균 과목 칸을 덧붙이듯 DataFrame에도 새 열을 만들 수 있습니다. 대괄호와 insert는 열을 추가하고 del은 열을 지우며 원본 표를 직접 바꿉니다. drop은 기본 설정에서 원본은 그대로 두고, 고른 행이나 열을 제외한 새 표를 만듭니다. drop에서 axis=0은 행, axis=1은 열입니다.',
        conceptSections:[
          ['먼저 표의 모양부터 볼까요?','먹거리·사진관·미니게임·음료가 가로 한 줄씩 있어 행은 4개입니다. 오전·점심·오후가 세로 한 칸씩 있어 열은 3개입니다. 그래서 size=(4, 3)은 “4개 부스 × 3개 시간대” 모양의 방문객 수를 만든다는 뜻입니다.'],
          ['seed(2026)은 무슨 뜻일까요?','무작위 번호 뽑기를 시작하기 전에 모두 같은 출발점을 맞추는 것과 같습니다. 같은 seed와 같은 코드를 같은 순서로 실행하면 모든 학생이 같은 무작위 숫자를 얻어 결과를 함께 비교할 수 있습니다. 2026은 수업 연도에 맞춰 고른 시작 번호일 뿐, 방문객 수나 숫자의 범위를 뜻하지 않습니다. 다른 seed를 쓰면 뽑히는 연습 숫자도 달라집니다.'],
          ['왜 표에 계산 결과를 붙일까요?','운영 본부는 부스별 낮 시간의 보통 방문객 수와 전체 방문객 수를 함께 보고 싶습니다. 계산값을 표 밖에 따로 적으면 어느 부스의 값인지 다시 맞춰야 합니다. 같은 부스 행의 낮평균·합계 열에 붙이면 원래 기록과 계산 결과를 바로 이어서 볼 수 있습니다.'],
          ['새 열은 어떻게 만들까요?','부스방문표에 아직 없는 낮평균이라는 열 이름을 대괄호에 쓰고 값을 넣으면 표의 맨 오른쪽에 새 열이 생깁니다. 각 부스 행에서 오전·점심·오후를 더해 3으로 나누고, round(..., 2)로 소수점 이하 둘째 자리까지 반올림합니다. 반 성적표에 과목별 평균 칸을 붙이는 것과 같습니다.'],
          ['del과 insert는 무슨 일을 할까요?','del은 원본 표에서 지정한 열을 바로 지웁니다. 이 수업에서는 합계 열을 만든 뒤 del의 작동을 확인하려고 잠시 지웁니다. insert(3, ...)의 3은 0부터 세어 네 번째 자리입니다. 따라서 오전(0)·점심(1)·오후(2) 다음 자리에 저녁 열이 끼워집니다. 두 명령 모두 원본 표를 직접 바꿉니다.'],
          ['drop에서 행과 열은 어떻게 구별할까요?','반 기록표에서 한 학생의 가로줄 전체를 빼는 것은 행 제외이고, 모든 학생의 한 과목 세로칸을 빼는 것은 열 제외입니다. 이 코드에서도 미니게임 부스 한 줄을 빼면 axis=0 또는 axis="rows", 모든 부스의 저녁 칸을 빼면 axis=1 또는 axis="columns"를 씁니다. 이 방향 설명은 drop 명령에서 사용하는 기준입니다.'],
          ['원본 표와 새 표는 무엇이 다를까요?','대괄호로 열을 만들기, del, insert는 원본 부스방문표를 직접 고칩니다. 반면 여기서 사용하는 drop은 원본을 지우지 않고 제외 결과를 새 표로 돌려줍니다. 그래서 미니게임제외표처럼 새 변수에 담으면 원본 네 부스와 제외한 표를 나란히 비교할 수 있습니다.']
        ],
        example:'반 기록표를 떠올려 봅시다. 평균 점수 칸을 새로 붙이는 것은 열 추가, 전학 간 학생 한 명의 가로줄을 제외하는 것은 행 제외, 모든 학생의 체육 점수 세로칸을 제외하는 것은 열 제외입니다. 부스방문표도 같은 방식으로 읽습니다.',
        keys:[['seed(2026)','같은 코드에서 모두 같은 무작위 숫자를 얻도록 출발점 맞추기'],['size=(4, 3)','부스 4개를 행으로, 시간대 3개를 열로 만들기'],['round(..., 2)','계산한 낮평균을 소수점 이하 둘째 자리까지 반올림'],['insert(3, ...)','0부터 세어 네 번째 자리인 오후 다음에 저녁 열 끼우기'],['drop의 axis','0 또는 rows는 행, 1 또는 columns는 열 제외']],
        codeGuide:'코드를 네 장면으로 나누어 읽습니다. ① 4개 부스와 3개 시간대의 기본 표를 만듭니다. ② 부스마다 오전·점심·오후를 더해 3으로 나눈 낮평균 열을 붙입니다. ③ 합계 열을 만들었다가 del 연습으로 지우고, insert로 오후 다음 자리에 저녁 열을 끼웁니다. ④ drop으로 특정 부스 행 또는 시간대 열을 제외한 새 표를 만듭니다. 대괄호·del·insert는 원본을 바꾸지만, 이 코드의 drop 결과는 새 변수에 담으므로 원본 부스방문표는 남아 있습니다.',
        code:`# 1. 무작위 숫자 뽑기의 출발점을 2026으로 맞춥니다.\n# 같은 코드와 같은 seed를 쓰면 모든 학생이 같은 숫자를 얻습니다.\nnp.random.seed(2026)\n# 20 이상 80 미만의 수를 4행 3열 모양으로 뽑습니다.\n부스별방문객수 = np.random.randint(20, 80, size=(4, 3))\n부스방문표 = pd.DataFrame(\n    부스별방문객수,\n    index=['먹거리', '사진관', '미니게임', '음료'],  # 가로줄 4개: 부스 이름\n    columns=['오전', '점심', '오후']                 # 세로칸 3개: 시간대\n)\n\n# 2. 각 부스의 오전·점심·오후 평균을 새 열로 붙입니다.\n부스방문표['낮평균'] = round(\n    (부스방문표['오전'] + 부스방문표['점심'] + 부스방문표['오후']) / 3,\n    2  # 소수점 이하 둘째 자리까지 반올림\n)\n# 3. 합계 열을 만든 뒤 del로 지우는 연습입니다.\n부스방문표['합계'] = 부스방문표['오전'] + 부스방문표['점심'] + 부스방문표['오후']\ndel 부스방문표['합계']\n\n# 4. 0부터 센 네 번째 자리, 즉 오후 다음에 저녁 열을 끼웁니다.\n부스방문표.insert(3, '저녁', [40, 50, 45, 55])\n# 5. drop은 원본을 두고, 고른 행이나 열을 제외한 새 표를 만듭니다.\n미니게임제외표 = 부스방문표.drop('미니게임', axis='rows')  # 부스 한 줄 제외\n사진관도제외한표 = 미니게임제외표.drop('사진관', axis=0)   # axis=0도 행\n저녁제외표 = 사진관도제외한표.drop('저녁', axis='columns') # 시간대 한 칸 제외\n오후까지제외표 = 저녁제외표.drop('오후', axis=1)           # axis=1도 열`,
        tip:'드롭다운에서 연산을 바꿀 때 행 수와 열 수가 어떻게 달라지는지 먼저 예측하게 한 뒤 실행합니다.'
      },
      {
        chapter:'Pandas', title:'빈칸을 발견하고 처리 근거를 세우다', badge:'어려움', sim:'missing', question:'q11',
        act:2, phase:'2막 · 지원이 필요한 곳 판단', phaseRange:'STEP 05-09',
        clue:'미니게임의 점심 방문객 칸이 비어 있어 그대로 방송하면 오보가 될 수 있습니다.',
        mission:'빈칸 원인을 확인하고 삭제·표시·평균 채우기 가운데 근거 있는 방법을 고릅니다.',
        next:'정리된 숫자를 청중이 한눈에 이해할 방송 화면으로 바꿉니다.',
        story:'방문표를 확인하던 기자가 미니게임의 점심 방문객 칸에서 숫자 대신 NaN을 발견했습니다. 정말 방문객이 0명이었던 것인지, 기록 기기가 멈춘 것인지 아직 모릅니다. 방송국은 빈칸을 서둘러 지우거나 채우지 않고 원인부터 확인한 뒤, 어떤 정보를 잃게 되는지 따져 처리 방법을 고릅니다.',
        concept:'NaN은 Not a Number의 줄임말로 “숫자로 정해진 값이 아님”을 뜻합니다. Pandas의 숫자 표에서는 아직 모르거나 기록되지 않은 값을 나타내는 특별한 빈칸 표시로 자주 사용합니다. 0은 0명이라고 확인된 숫자이지만 NaN은 몇 명인지 모르는 상태입니다. dropna는 빈칸이 있는 행이나 열을 제외하고, fillna는 정한 값으로 빈칸을 채웁니다.',
        conceptSections:[
          ['NaN은 어떤 말의 약자일까요?','NaN은 영어 Not a Number의 첫 글자를 딴 말이며 “숫자로 정해진 값이 아님”이라는 뜻입니다. Pandas의 숫자 표에서는 기기 오류, 조사 누락, 아직 입력하지 않음처럼 값을 알 수 없을 때 쓰는 특별한 표시입니다. 글자 그대로 읽어 “숫자가 아닌 아무 값”이라고 생각하기보다, 이 표에서는 “아직 모르는 숫자”라고 이해하면 쉽습니다.'],
          ['NaN과 0은 왜 다를까요?','0은 조사해 보니 방문객이 0명이었다는 확인된 기록입니다. NaN은 조사하지 못했거나 기록 장치가 멈춰 몇 명인지 모르는 상태입니다. 온라인 수업표에서 0분은 접속하지 않았다고 확인된 값이고, 빈칸은 접속 시간이 아직 전송되지 않은 상태인 것과 같습니다. 빈칸을 0으로 바꾸면 모르는 사실을 없었다고 단정하게 됩니다.'],
          ['왜 원본을 복사하고 낮평균을 뺄까요?','실습용 빈칸을 만들기 전에 copy()로 복사본을 만들면 앞 장의 원본 부스방문표를 보호할 수 있습니다. 낮평균은 빈칸이 생기기 전에 계산한 값이므로 그대로 두면 현재 표와 맞지 않을 수 있어 연습표에서 먼저 제외합니다. astype("float")는 숫자를 실수형으로 바꾸어 NaN을 넣을 수 있게 합니다.'],
          ['빈칸을 그대로 두면 계산은 어떻게 될까요?','Pandas의 mean()은 기본적으로 NaN을 빼고 남은 숫자만 평균 냅니다. 이 표에서는 미니게임 점심 값을 빼고 먹거리·사진관·음료 세 부스의 점심 값으로 평균을 계산합니다. 결과가 나오더라도 네 부스 전체의 실제 평균은 아니므로, 몇 개의 값으로 계산했는지 반드시 확인해야 합니다.'],
          ['dropna로 지우면 무엇을 잃을까요?','dropna(axis=0)은 NaN이 들어 있는 미니게임 행 전체를 제외하므로 미니게임의 정상적인 오전·오후 기록도 함께 사라집니다. dropna(axis=1)은 점심 열 전체를 제외하므로 다른 세 부스의 정상 점심 기록도 함께 사라집니다. 지우기 전에는 방송 질문에 그 정보가 정말 필요 없는지 확인해야 합니다.'],
          ['fillna로 채우면 모두 해결될까요?','fillna("확인 중")은 화면에서 상태를 알려 주기에는 쉽지만 숫자 열에 문자가 섞여 평균 계산이 어려워집니다. 나머지 세 부스의 점심 평균으로 채우면 계산은 계속할 수 있지만, 그 값은 미니게임에서 실제로 센 방문객 수가 아니라 주변 자료로 추정한 대체값입니다. 채운 방법과 한계를 꼭 기록해야 합니다.'],
          ['어떤 순서로 처리하면 좋을까요?','첫째, 어느 칸이 왜 비었는지 확인합니다. 둘째, 분석 목적에 따라 그대로 둘지, 행·열을 제외할지, 표시용 문자나 근거 있는 숫자로 채울지 고릅니다. 셋째, 처리 전후의 행·열 개수와 평균을 비교합니다. 마지막으로 실제 관찰값과 대체값을 구별해 기록합니다.']
        ],
        example:'학급 과제표에서 0점은 과제를 확인해 점수가 0점인 경우이고, 빈칸은 아직 제출 여부나 점수를 확인하지 못한 경우입니다. 빈칸을 마음대로 0점으로 쓰면 학생의 실제 상태를 잘못 기록합니다. 방문객 표의 NaN도 같은 마음으로 다룹니다.',
        keys:[['NaN','Not a Number: 이 표에서는 아직 모르거나 기록되지 않은 숫자'],['0과 NaN','0은 확인된 값, NaN은 값을 모르는 상태'],['dropna(axis=0)','빈칸이 있는 행 전체 제외'],['dropna(axis=1)','빈칸이 있는 열 전체 제외'],['fillna','빈칸을 정한 값으로 채우되 근거와 한계 기록']],
        codeGuide:'코드는 다섯 단계로 읽습니다. ① 원본을 보호하려고 복사본을 만들고, 빈칸을 넣을 수 있도록 숫자를 실수형으로 바꿉니다. ② 미니게임의 점심 한 칸에 NaN을 넣어 기록 누락을 재현합니다. ③ dropna(axis=0)은 미니게임 행 전체를, axis=1은 점심 열 전체를 제외한 새 표를 만듭니다. ④ “확인 중”은 화면 표시용 문자라 숫자 계산에는 알맞지 않습니다. ⑤ mean()은 NaN을 빼고 나머지 세 부스의 점심 평균을 구하며, fillna는 그 평균을 대체값으로 넣습니다. 대체값은 실제 관찰값이 아닙니다.',
        code:`# 1. 원본을 보호하려고 복사본을 만듭니다.\n# 낮평균은 빈칸이 생기기 전에 계산했으므로 연습표에서 제외합니다.\n# float는 NaN을 담을 수 있는 실수형입니다.\n방문수실수표 = 부스방문표.drop(columns=['낮평균']).astype('float').copy()\n# 2. 미니게임의 점심 한 칸을 “아직 모르는 값”인 NaN으로 표시합니다.\n방문수실수표.loc['미니게임', '점심'] = np.nan\n\n# 3. axis=0은 NaN이 있는 미니게임 행 전체를 제외합니다.\n빈칸행제외표 = 방문수실수표.dropna(axis=0)\n# axis=1은 NaN이 있는 점심 열 전체를 제외합니다.\n빈칸열제외표 = 방문수실수표.dropna(axis=1)\n# 4. 표시용 복사본을 만들고, 빈칸이 있는 점심 열만 문자도 담을 수 있게 바꿉니다.\n문자열로빈칸채운표 = 방문수실수표.copy()\n문자열로빈칸채운표['점심'] = (\n    방문수실수표['점심'].astype('object').fillna('확인 중')\n)\n\n# 5. mean()은 NaN을 빼고 나머지 세 부스의 점심 평균을 냅니다.\n점심평균방문객 = 방문수실수표['점심'].mean()\n# 그 평균으로 점심의 NaN만 채웁니다. 실제 관찰값이 아닌 대체값입니다.\n평균으로빈칸채운표 = 방문수실수표.fillna({'점심': 점심평균방문객})`,
        tip:'“확인 중”은 화면 표시에는 쉽지만 숫자 계산에는 맞지 않는다는 점을 직접 비교하게 합니다.'
      },

        concept:'Colab에서는 koreanize-matplotlib을 한 번 설치하고 불러오면 한글 글꼴이 자동으로 적용됩니다. 런타임을 다시 시작하거나 글꼴 캐시를 직접 지울 필요가 없습니다. plt.plot에 y값만 주면 x에는 0, 1, 2, 3이라는 기록 자리 번호가 자동으로 붙습니다.',
        conceptSections:[
          ['꺾은선그래프는 언제 필요할까요?','시간처럼 앞뒤 순서가 있는 값이 어떻게 변했는지 볼 때 사용합니다. 점을 순서대로 이어 보면 어느 기록에서 값이 커지고 작아졌는지 흐름을 따라갈 수 있습니다.'],
          ['왜 여기서 선으로 이을까요?','운영 본부는 대기 시간이 8분, 15분, 23분, 12분으로 변한 순서를 알고 싶어 합니다. 8→15→23에서는 선이 올라가므로 줄이 길어졌고, 23→12에서는 선이 내려가므로 줄이 짧아졌음을 바로 볼 수 있습니다.'],
          ['생활 속에서는 언제 볼까요?','아침·점심·저녁의 기온 변화, 달리기를 한 바퀴씩 돌 때 걸린 시간, 날짜별 용돈 잔액처럼 순서에 따라 달라지는 값을 볼 때 꺾은선그래프가 편합니다. 반대로 좋아하는 간식 이름처럼 앞뒤 순서가 없는 항목은 선으로 이어 흐름을 만들지 않습니다.'],
          ['한글 글꼴은 어떻게 간단히 준비할까요?','Colab에서 !pip install -q koreanize-matplotlib을 한 번 실행한 뒤 import koreanize_matplotlib을 실행합니다. 그러면 나눔고딕이 자동으로 적용됩니다. -q는 quiet의 줄임말로 긴 설치 메시지를 줄여 수업 화면을 깔끔하게 합니다. 새 런타임을 열었을 때만 설치 셀을 다시 실행하면 됩니다.'],
          ['코드는 어떤 순서로 읽을까요?','먼저 네 대기 시간을 리스트에 담습니다. plt.plot은 네 값을 순서대로 점으로 찍고 선으로 잇습니다. marker="o"는 각 기록 위치를 동그란 점으로 보여 줍니다. title은 제목, xlabel은 가로축 이름, ylabel은 세로축 이름과 단위를 붙이고 show는 완성한 그래프를 화면에 보여 줍니다.'],
          ['x값을 쓰지 않으면 어떻게 될까요?','plt.plot에 y값만 주면 Matplotlib이 x자리에 0, 1, 2, 3이라는 기록 순서를 자동으로 붙입니다. 이 숫자는 실제 시각이 아니라 0부터 센 자리 번호입니다. 실제 방송에서는 오전·점심·오후·저녁처럼 시간 이름을 x값으로 넣으면 뜻이 더 분명합니다.']

        example:'하루 기온이 아침 8도, 낮 15도, 오후 23도, 밤 12도였다고 생각해 봅시다. 숫자만 읽을 때보다 점을 차례로 이어 보면 기온이 올라갔다가 내려간 흐름이 바로 보입니다. 대기 시간도 같은 방법으로 읽습니다.',
        keys:[['koreanize-matplotlib','한글 글꼴을 자동으로 적용하는 도구'],['plt.plot','값을 순서대로 점으로 찍고 선으로 잇기'],['marker="o"','각 기록 위치를 동그란 점으로 표시'],['title·xlabel·ylabel','제목·가로축·세로축 설명 붙이기'],['plt.show','완성한 그래프를 화면에 표시']],
        codeGuide:'첫 두 줄은 한글 제목이 네모로 깨지지 않게 준비합니다. 설치 명령의 -q는 긴 메시지를 줄여 주고, import koreanize_matplotlib은 한글 글꼴을 자동 적용합니다. 그다음 네 대기 시간을 리스트에 담고, plot으로 순서대로 잇습니다. marker="o"는 네 기록의 위치를 점으로 표시합니다. title·xlabel·ylabel은 그래프를 읽는 데 필요한 제목·축 이름·단위를 붙이며, show는 완성한 화면을 보여 줍니다.',
        code:`# Colab에서 새 런타임을 열었을 때 한 번만 설치합니다.\n# -q는 긴 설치 메시지를 줄여 줍니다.\n!pip install -q koreanize-matplotlib\n\nimport matplotlib.pyplot as plt          # 그래프를 그리는 도구\nimport koreanize_matplotlib              # 한글 글꼴을 자동으로 적용\n\n# 네 번 기록한 대기 시간을 순서대로 담습니다.\n시간대별대기시간 = [8, 15, 23, 12]\n# 네 값을 점으로 찍어 선으로 잇습니다. marker='o'는 동그란 점입니다.\nplt.plot(시간대별대기시간, marker='o')\n# 그래프의 제목과 두 축의 뜻·단위를 적습니다.\nplt.title('시간대별 축제 대기 시간')\nplt.xlabel('기록 순서')                 # 자동으로 0, 1, 2, 3이 붙음\nplt.ylabel('대기 시간(분)')             # 값의 뜻과 단위는 분\n# 준비한 그래프를 화면에 보여 줍니다.\nplt.show()`,

        concept:'범주는 먹거리·사진관처럼 대상을 나누는 이름이고, 수치는 판매 개수·대기 시간처럼 계산할 수 있는 숫자입니다. 막대그래프는 범주별 숫자의 크기, 산점도는 두 수치의 짝과 관계, 상자그림은 여러 값의 가운데와 퍼진 정도를 보여 줍니다. 그래프에서 관계가 보여도 원인이라고 바로 단정하지 않습니다.',
        conceptSections:[
          ['먼저 범주와 수치는 무엇일까요?','범주는 먹거리·사진관·미니게임처럼 대상을 나누는 이름이나 종류입니다. 수치는 95개·70개 같은 판매 개수나 30분·18분 같은 계산 가능한 숫자입니다. “어떤 부스인가?”는 범주이고 “몇 개 또는 몇 분인가?”는 수치라고 구별하면 그래프를 고르기 쉬워집니다.'],
          ['막대그래프는 언제 사용할까요?','여러 범주의 숫자 크기를 비교할 때 사용합니다. 부스 이름마다 막대 하나를 세우면 막대가 높을수록 판매 개수가 많습니다. 편의점에서 과자 종류별 판매량을 나란히 비교하는 것과 같습니다. 막대 사이를 띄우는 이유는 부스가 서로 다른 종류임을 보여 주기 위해서입니다.'],
          ['산점도는 무엇을 보여 줄까요?','산점도는 두 수치를 한 쌍으로 묶어 점으로 찍는 그래프입니다. 첫 점 (2, 30)은 운영 인원 2명과 대기 시간 30분이 한 부스에서 함께 기록되었다는 뜻입니다. 오른쪽으로 갈수록 인원이 많고 위로 갈수록 대기 시간이 깁니다. 점들이 어느 방향으로 모이는지 보며 두 수치의 관계를 살핍니다.'],

          ['나란한 막대와 범례는 무엇일까요?','같은 부스에서 오전과 오후처럼 두 값을 비교하려면 막대 두 개를 옆에 놓습니다. 범례는 그래프의 색이 무엇을 뜻하는지 알려 주는 작은 이름표입니다. 초록은 오전, 하늘색은 오후처럼 범례를 먼저 읽고 같은 부스의 두 막대 높이를 비교합니다.'],
          ['상자그림은 왜 필요할까요?','여러 번 잰 값을 작은 순서로 줄 세웠을 때 가운데 값과 값들이 얼마나 퍼져 있는지 짧게 요약합니다. 중앙값은 한가운데를 나타내는 값입니다. Q1과 Q3는 자료를 네 부분으로 나눌 때 첫 번째와 세 번째 경계이며, 상자는 Q1부터 Q3까지인 가운데 약 50%의 값을 보여 줍니다.'],
          ['IQR·수염·이상치는 무슨 뜻일까요?','IQR은 Interquartile Range의 줄임말이며 사분위 범위라고 부릅니다. Q3−Q1로 계산하며 상자의 길이, 즉 가운데 절반이 퍼진 정도입니다. 수염은 이상치 판단 범위 안의 실제 값까지 뻗은 선입니다. 이상치는 다른 값들과 멀리 떨어져 따로 표시된 값이며, 틀렸다는 뜻이 아니라 이유를 확인할 후보입니다.'],
          ['이 자료의 상자그림은 어떻게 읽을까요?','작은 순서로 놓으면 7, 8, 9, 11, 12, 14, 16, 18, 21, 25입니다. Matplotlib 기본 선형보간 방식에서 중앙값은 13, Q1은 9.5, Q3는 17.5이며 IQR은 8입니다. 이상치 경계는 −2.5 미만 또는 29.5 초과이고, 모든 값이 경계 안에 있어 이상치는 없습니다. 수염 끝은 실제 값 7과 25입니다.']

        conceptSections:[
          ['우리는 지금까지 무엇을 배웠을까요?','NumPy로 여러 숫자를 빠르게 계산했고, Pandas의 Series와 DataFrame으로 이름이 붙은 자료를 정리했습니다. loc·iloc으로 필요한 곳을 찾고, 조건식으로 행을 골랐습니다. 열을 만들거나 지우고, 정렬하고, NaN을 확인한 뒤, 질문에 맞는 그래프로 결과를 보여 주었습니다. 12장은 이 도구들을 따로 외우는 장이 아니라 한 가지 질문을 해결하는 순서로 다시 연결하는 장입니다.'],
          ['계산과 선택에서 무엇을 꼭 구별할까요?','arange(시작, 끝, 간격)는 끝값 바로 앞에서 멈추므로 끝값을 포함하지 않습니다. reshape는 자료를 놓는 모양만 바꾸며 값·개수·합계는 바꾸지 않습니다. loc는 행과 열의 이름표로 찾고 iloc는 0부터 세는 자리로 찾습니다. >는 같은 값을 빼는 “초과”, >=는 같은 값도 넣는 “이상”입니다. &는 두 조건을 모두 만족, |는 하나 이상 만족이며 각 조건을 괄호로 감쌉니다.'],
          ['표를 바꿀 때 무엇을 꼭 구별할까요?','sort_values는 기준 열의 값에 따라 행 순서를 바꾸고 ascending=False는 큰 값부터 놓습니다. T는 행과 열을 서로 바꾸어 읽는 방향만 바꿉니다. drop에서 axis=0은 행을 대상으로 하고 axis=1은 열을 대상으로 합니다. NaN은 값이 0이라는 뜻이 아니라 아직 모르거나 기록되지 않았다는 뜻입니다. 평균으로 빈칸을 채운 값은 실제 관찰값이 아니라 계산을 이어 가기 위한 대체값이므로 처리 이유와 한계를 남겨야 합니다.'],
          ['질문에 맞는 그래프는 어떻게 고를까요?','시간 순서에 따른 변화는 꺾은선그래프, 부스처럼 범주별 크기 비교는 막대그래프, 두 수치의 짝과 관계는 산점도, 여러 값의 중앙과 퍼짐은 상자그림이 알맞습니다. 그래프에서 함께 움직이는 관계가 보여도 한 값이 다른 값의 원인이라고 단정할 수 없습니다. 제목·축·단위·범례를 먼저 확인한 뒤 보이는 사실과 아직 모르는 점을 함께 말합니다.'],
          ['분석의 다섯 걸음은 무엇일까요?','① 질문: 무엇을 알고 싶은지 정합니다. ② 선택: 필요한 행과 열을 고릅니다. ③ 계산: 평균·합계·최댓값을 구합니다. ④ 표현: 표와 그래프로 비교합니다. ⑤ 해석: 사실·근거·한계·다음 행동을 말합니다. 학교 매점에서 어떤 간식을 더 준비하면 좋을지 생각할 때도 “궁금한 점 정하기→판매표 확인하기→합계 계산하기→막대그래프로 비교하기→친구들과 의견 나누기”의 같은 순서를 씁니다.'],
          ['사실·근거·해석은 어떻게 다를까요?','사실은 표나 그래프에서 직접 확인한 내용입니다. 근거는 그 사실을 뒷받침하는 숫자나 계산 결과입니다. 해석은 사실과 근거가 질문에 어떤 뜻인지 설명하는 말입니다. “미니게임 줄이 가장 길다”는 사실, “25분”은 근거, “먼저 상황을 확인하자”는 해석입니다. 해석을 사실처럼 단정하지 않는 것이 중요합니다.'],
          ['범위·한계·일반화는 무슨 뜻일까요?','범위는 언제·어디서·누구를 조사했는지 정한 울타리입니다. 한계는 그 울타리 밖은 아직 모른다는 뜻입니다. 일반화는 일부 자료에서 얻은 결과를 더 넓은 대상에도 적용하는 것입니다. 이번 자료는 한 시점의 다섯 부스만 조사했으므로 다른 날이나 모든 학교 축제까지 “언제나 같다”고 일반화할 수 없습니다.'],
          ['평균은 어떻게 읽을까요?','평균은 여러 값을 모두 더한 뒤 값의 개수로 나눈 대표값입니다. 대기 시간은 18+7+25+14+9=73분이고 부스는 5곳이므로 평균은 73÷5=14.6분입니다. 만족도는 4.2+4.7+4.4+4.1+4.6=22.0점이므로 평균은 22.0÷5=4.4점입니다. 평균은 전체 모습을 짧게 보여 주지만 각 부스의 실제 값과 같다는 뜻은 아닙니다.'],

          ['f-string과 :.1f는 무엇일까요?','f-string은 글 안에 변수 값을 넣어 출력하는 방법입니다. 문자열 앞의 f는 format, 즉 값을 보기 좋은 모양으로 넣는다는 뜻입니다. 중괄호 { } 안에 변수 이름을 쓰고, :.1f를 붙이면 소수점 이하 한 자리까지 표시합니다. 14.6은 14.6으로, 4.4는 4.4로 보여 주며 원래 자료를 바꾸는 명령은 아닙니다.'],

        example:'오늘 등굣길 버스가 15분 늦었다는 것은 사실이고, 앱의 도착 기록 15분은 근거입니다. “내일도 반드시 늦는다”는 말은 한 번의 기록을 지나치게 넓힌 해석입니다. “오늘 기록에서는 15분 늦었지만 하루 자료뿐이므로 다음 주 기록도 살펴보자”라고 말해야 정확합니다.',
        keys:[['사실','표나 그래프에서 직접 확인한 내용'],['근거','사실을 뒷받침하는 숫자와 계산 결과'],['해석','사실과 근거가 질문에 어떤 뜻인지 설명한 말'],['범위','조사한 날짜·시간·장소·대상'],['한계','자료만으로는 아직 말할 수 없는 부분'],['일반화','일부 결과를 더 넓은 대상에도 적용하는 것'],['mean()','값을 모두 더해 개수로 나눈 평균'],['max()','가장 큰 값 자체'],['idxmax()','가장 큰 값이 있는 행의 이름표'],[':.1f','출력할 때 소수점 이하 한 자리까지 표시']],
        codeGuide:'코드를 질문 순서로 읽습니다. ① DataFrame은 부스 이름·대기 시간·만족도를 한 표로 묶습니다. ② mean()은 각 숫자 열의 평균을 구합니다. ③ idxmax()는 가장 큰 값이 있는 행 이름표를 찾고, loc는 그 행에서 부스 이름을 꺼냅니다. ④ f-string은 계산 결과를 설명 문장에 넣고 :.1f는 소수점 이하 한 자리로 표시합니다. max()가 값 자체를, idxmax()가 그 값의 위치를 준다는 차이를 꼭 확인합니다.',
        code:`import pandas as pd\n\n# 1. 부스마다 이름·대기 시간·만족도를 한 행에 모아 최종 상황표를 만듭니다.\n최종부스분석표 = pd.DataFrame({\n    '부스이름': ['먹거리', '사진관', '미니게임', '음료', '책갈피'],\n    '대기시간분': [18, 7, 25, 14, 9],\n    '만족도': [4.2, 4.7, 4.4, 4.1, 4.6]\n})\n\n# 2. mean()으로 다섯 부스의 대표값인 평균을 계산합니다.\n평균대기시간 = 최종부스분석표['대기시간분'].mean()  # 73 ÷ 5 = 14.6\n평균만족도 = 최종부스분석표['만족도'].mean()       # 22.0 ÷ 5 = 4.4\n\n# 3. idxmax()로 가장 큰 값의 행 이름표를 찾고, loc로 그 부스 이름을 꺼냅니다.\n가장긴대기부스 = 최종부스분석표.loc[\n    최종부스분석표['대기시간분'].idxmax(), '부스이름'\n]\n만족도최고부스 = 최종부스분석표.loc[\n    최종부스분석표['만족도'].idxmax(), '부스이름'\n]\n\n# 4. f-string으로 설명과 결과를 함께 출력합니다. :.1f는 소수점 이하 한 자리 표시입니다.\nprint(f'평균 대기 시간: {평균대기시간:.1f}분')\nprint(f'평균 만족도: {평균만족도:.1f}점')\nprint(f'가장 긴 줄의 부스: {가장긴대기부스}')\nprint(f'만족도가 가장 높은 부스: {만족도최고부스}')`,

      }

        steps:['NaN은 Not a Number의 줄임말이며, 이 표에서는 아직 모르는 방문객 수를 나타냅니다.','점심 열의 목적은 방문객 수 계산인데 “확인 중”을 넣으면 숫자와 문자가 한 열에 섞입니다.','사람이 화면을 읽기에는 쉽지만 평균과 그래프 계산에는 바로 쓸 수 없으므로, 표시용 표와 계산용 표를 구별해야 합니다.'],
        daily:'계산기에 가격 대신 “품절”을 넣으면 합계를 낼 수 없습니다. 방문객 수 열도 같아서 화면 표시용 말과 계산용 숫자를 구분해야 합니다.',
        model:'문자열 대체는 방문객 수 열에 숫자와 문자를 섞어 평균 같은 수치 분석을 어렵게 한다.'
      },
      {
        id:'q12', level:'어려움', prompt:'한 시점에 다섯 부스를 관찰했으며 미니게임의 대기 시간 25분이 가장 길었습니다. 이를 근거로 “미니게임은 언제나 운영이 가장 나쁜 부스다”라고 결론 낸 설명의 가장 큰 문제는?',
        choices:[['25분은 긴 시간이 아니기 때문이다','주어진 표에서는 다섯 부스 중 가장 긴 대기 시간이 맞습니다. 핵심 문제는 결론의 범위를 넓히고 운영 전체를 단정했다는 점입니다.'],['미니게임을 표에서 찾을 수 없기 때문이다','표에 미니게임이 분명히 있습니다.'],['한 시점의 다섯 부스 기록을 언제나로 넓히고 대기 시간만으로 운영 전체를 평가했다','정답입니다. 관찰한 시간과 대상의 범위를 넘어 일반화했고, 대기 시간 하나로 운영 전체가 가장 나쁘다고 단정했습니다.'],['대기 시간은 서로 비교할 수 없기 때문이다','같은 단위의 대기 시간은 비교할 수 있지만 조사 조건과 원인을 확인해야 합니다.']], answer:2,
        steps:['이 자료는 한 시점의 다섯 부스 기록이며, 직접 확인되는 사실은 그 안에서 미니게임의 대기 시간이 25분으로 가장 길다는 것입니다.','긴 줄은 인기, 게임 시간, 운영 인원 등 여러 이유로 생길 수 있으므로 대기 시간 하나로 운영 전체를 평가할 수 없습니다.','다른 시간과 날짜 자료가 없으므로 언제나 운영이 나쁘다고 일반화할 수 없습니다.'],
        daily:'오늘 한 번 버스가 늦었다고 그 노선이 언제나 가장 나쁘다고 말할 수는 없습니다. 날짜, 교통 상황, 여러 번의 도착 기록을 함께 봐야 합니다.',
        model:'한 시점에 관찰한 다섯 부스 중 미니게임의 대기 시간이 25분으로 가장 길지만, 이를 언제나로 일반화하거나 대기 시간만으로 운영 전체가 가장 나쁘다고 단정할 수 없다.'
      }
    ];

    const state = {
      lesson:0,
      mode:'수업',
      fontSize:16,
      runAction:null,
      practiceAnswers:{},
      assessmentAnswers:{},
      assessmentIndex:0,
      assessmentFinished:false
    };

    const app = document.querySelector('#app');
    const content = document.querySelector('#lessonContent');
    const nav = document.querySelector('#lessonNav');
    const toast = document.querySelector('#toast');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function sum(values) { return values.reduce((total, value) => total + Number(value), 0); }
    function mean(values) { return values.length ? sum(values) / values.length : NaN; }
    function cloneRows(rows) { return rows.map(row => ({...row})); }

    function tableHtml(rows, columns, highlightIndex = null) {
      if (!rows.length) return '<div class="empty-state">조건에 맞는 행이 없습니다.<br>비교 기호와 기준값을 다시 확인하세요.</div>';
      return `<div class="data-table-wrap"><table><thead><tr>${columns.map(column => `<th>${escapeHtml(column)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index) => `<tr class="${index === highlightIndex ? 'highlight' : ''}">${columns.map(column => `<td>${row[column] === null || Number.isNaN(row[column]) ? '<span class="nan">NaN</span>' : escapeHtml(row[column])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }

    function announce(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(announce.timer);
      announce.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function levelClass(level) { return level === '중간' ? 'medium' : level === '어려움' ? 'hard' : ''; }
    function answersForCurrentMode() { return state.mode === '평가' ? state.assessmentAnswers : state.practiceAnswers; }

    function renderNav() {
      nav.innerHTML = lessons.map((lesson,index) => `<button type="button" class="lesson-btn ${index === state.lesson ? 'active' : ''}" data-lesson="${index}"><span class="lesson-number">${String(index + 1).padStart(2,'0')}</span><span class="lesson-name">${escapeHtml(lesson.title)}</span></button>`).join('');
      nav.querySelectorAll('[data-lesson]').forEach(button => button.addEventListener('click', () => goLesson(Number(button.dataset.lesson))));
    }

    function renderLesson() {
      app.classList.toggle('practice-mode', state.mode === '연습');
      if (state.mode === '평가') {
        renderAssessment();
        updateChrome();
        return;
      }
      const lesson = lessons[state.lesson];
      const isPractice = state.mode === '연습';
      const stepNumber = String(state.lesson + 1).padStart(2,'0');
      const conceptContent = lesson.conceptSections
        ? lesson.conceptSections.map(section => `<section class="concept-section"><h4>${escapeHtml(section[0])}</h4><p>${escapeHtml(section[1])}</p></section>`).join('')
        : `<p>${escapeHtml(lesson.concept)}</p>`;
      const conceptBand = `<article class="band concept-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '4' : '1'}</span> 쉬운 말로 개념 잡기</h3>
        <div class="concept-text">${conceptContent}</div>
        <div class="life-example"><strong>생활 속에서 떠올리기</strong>${escapeHtml(lesson.example)}</div>
        <div class="key-list">${lesson.keys.map(item => `<div class="key-item"><code>${escapeHtml(item[0])}</code><span>${escapeHtml(item[1])}</span></div>`).join('')}</div>
      </article>`;
      const codeBand = `<article class="band code-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '3' : '2'}</span> 코랩 코드 읽기</h3>
        <p class="caption">${escapeHtml(lesson.codeGuide || '코드는 앞 단계에서 만든 변수와 표를 이어서 사용합니다. 코랩에서는 위에서 아래로 실행합니다. 실행 결과를 묻는 문항은 필요한 라이브러리·표·실행 순서를 함께 제시해야 합니다.')}</p>
        <div class="code-shell">
          <div class="code-toolbar"><span><strong>Colab</strong> · Python</span><button type="button" class="copy-btn" id="copyCode">코드 복사</button></div>
          <pre><code id="codeText"></code></pre>
        </div>
      </article>`;
      const simulatorBand = `<article class="band simulator-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '1' : '3'}</span> ${isPractice ? '먼저 예상하고 직접 실행하기' : '실행 결과 시뮬레이터'}</h3>
        <div class="simulator" id="simulator"></div>
      </article>`;
      const quizBand = `<section class="band quiz-band">
        <h3 class="band-title"><span class="band-index">${isPractice ? '2' : '4'}</span> ${isPractice ? '내 말로 풀어 보는 문제' : '바로 확인 문제'}</h3>
        <div id="quickQuiz"></div>
      </section>`;
      const storyRail = `<section class="story-rail" aria-label="${escapeHtml(lesson.phase)} 이야기 흐름">
        <div class="story-phase"><span>${escapeHtml(lesson.phaseRange)} · 전체 3막 중 ${lesson.act}막</span><strong>${escapeHtml(lesson.phase)}</strong></div>
        <div class="story-beat"><strong>확보한 단서</strong><span>${escapeHtml(lesson.clue)}</span></div>
        <div class="story-beat mission"><strong>${isPractice ? '이번 연습 임무' : '이번 취재 임무'}</strong><span>${escapeHtml(lesson.mission)}</span></div>
        <div class="story-beat next"><strong>다음 장면으로</strong><span>${escapeHtml(lesson.next)}</span></div>
      </section>`;
      const lessonBody = isPractice
        ? `<section class="lesson-grid practice-layout"><div class="main-column">${simulatorBand}${quizBand}</div><aside class="side-column">${codeBand}${conceptBand}</aside></section>`
        : `<section class="lesson-grid"><div class="main-column">${conceptBand}${codeBand}${simulatorBand}</div><aside class="side-column"><section class="band teacher-only"><h3 class="band-title"><span class="band-index">T</span> 교사용 진행 포인트</h3><div class="teacher-tip"><strong>칠판 질문</strong>${escapeHtml(lesson.tip)}</div></section>${quizBand}</aside></section>`;
      content.innerHTML = `
        <section class="stage-head ${isPractice ? 'practice-stage' : ''}">
          <div>
            <span class="eyebrow">${isPractice ? '연습 미션' : escapeHtml(lesson.chapter)} · STEP ${stepNumber}</span>
            <h2>${isPractice ? `미션 ${stepNumber}. ` : ''}${escapeHtml(lesson.title)}</h2>
            <p>${isPractice ? '설명부터 외우지 않습니다. 결과를 먼저 예상하고, 값을 바꾸어 실행한 뒤, 문제로 이유를 확인합니다.' : escapeHtml(lesson.story)}</p>
          </div>
          <div class="stage-badge">${isPractice ? '직접 해보기' : escapeHtml(lesson.badge)}</div>
        </section>
        ${storyRail}
        ${isPractice ? `<section class="practice-brief" aria-label="연습 순서"><strong>연습 순서</strong><span class="practice-step"><b>1</b>결과 예상</span><span class="practice-step"><b>2</b>값 바꾸기</span><span class="practice-step"><b>3</b>직접 실행</span><span class="practice-step"><b>4</b>이유 설명</span></section>` : ''}
        ${lessonBody}`;
      document.querySelector('#codeText').textContent = lesson.code;
      document.querySelector('#copyCode').addEventListener('click', () => copyText(lesson.code));
      mountSimulator(lesson.sim);
      renderQuiz(questions.find(question => question.id === lesson.question), document.querySelector('#quickQuiz'), true);
      renderNav();
      updateChrome();
    }

    function simulatorShell(controls) {
      const simulator = document.querySelector('#simulator');
      simulator.innerHTML = `<div class="sim-toolbar">${controls}<button type="button" class="run-btn" id="runCell">▶ 실행</button></div><div class="sim-output" id="simOutput" aria-live="polite"><div class="empty-state">실행하기 전에 결과를 먼저 예상하세요.<br>그다음 실행 버튼으로 확인합니다.</div></div>`;
      document.querySelector('#runCell').addEventListener('click', () => {
        if (state.runAction) state.runAction();
      });
    }

    function mountSimulator(type) {
      state.runAction = null;
      if (type === 'intro') mountIntro();
      if (type === 'array') mountArray();
      if (type === 'zones') mountZones();
      if (type === 'series') mountSeries();
      if (type === 'select') mountSelect();
      if (type === 'filter') mountFilter();
      if (type === 'sort') mountSort();
      if (type === 'tablework') mountTablework();
      if (type === 'missing') mountMissing();
      if (type === 'line') mountLine();
      if (type === 'charts') mountCharts();
      if (type === 'final') mountFinal();
    }

    function mountIntro() {
      simulatorShell(`<div class="control"><span class="label">방송 단계</span><select id="library"><option value="numpy">NumPy</option><option value="pandas">Pandas</option><option value="matplotlib">Matplotlib</option></select></div>`);
      state.runAction = () => {
        const value = document.querySelector('#library').value;
        const info = {
          numpy:['현장 숫자 빠르게 계산','대기 시간 열 개 → 합계 325분','계산 결과를 다음 표 단계로 보냅니다.'],
          pandas:['부스 상황판에서 찾기','축제부스표 → 조건에 맞는 부스만 선택','정리한 표를 그래프로 보냅니다.'],
          matplotlib:['숫자를 방송 화면으로 번역','부스별 판매 개수 → 막대 높이','그래프에서 사실과 한계를 읽습니다.']
        }[value];
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>도구</span><strong>${value}</strong></div><div class="metric"><span>핵심 역할</span><strong>${info[0]}</strong></div><div class="metric"><span>다음 단계</span><strong>연결</strong></div></div><p>${info[1]}</p><p class="caption">${info[2]}</p>`;
      };
    }

    function mountArray() {
      simulatorShell(`<div class="control"><label for="arrayRows">놓는 모양</label><select id="arrayRows"><option value="1">한 줄에 10개 (1행 10열)</option><option value="2" selected>두 줄에 5개씩 (2행 5열)</option><option value="5">다섯 줄에 2개씩 (5행 2열)</option><option value="10">열 줄에 1개씩 (10행 1열)</option></select></div>`);
      state.runAction = () => {
        const rows = Number(document.querySelector('#arrayRows').value);
        const columns = 10 / rows;
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>놓는 모양</span><strong>${rows}줄 × ${columns}개</strong></div><div class="metric"><span>기록 수</span><strong>10개</strong></div><div class="metric"><span>전체 합</span><strong>325분</strong></div></div><div class="array-grid" style="grid-template-columns:repeat(${columns},minmax(36px,1fr))">${Array.from({length:10},(_,index) => `<div class="array-cell" style="animation-delay:${index * 25}ms">${10 + index * 5}</div>`).join('')}</div><p class="caption">컴퓨터에서는 이 모양을 ${rows}행 ${columns}열이라고 부릅니다. 놓는 모양이 바뀌어도 10개 기록과 전체 합 325분은 그대로입니다.</p>`;
      };
    }

    function mountZones() {
      const values = Object.entries(구역방문객).map(([구역, 방문객수]) => [구역, ...방문객수]);
      simulatorShell(`<div class="control" style="flex:1"><span class="label">세 번의 방문객 기록을 바꿔 보고 다시 실행</span><div class="score-inputs"><strong>구역</strong><strong>취재1</strong><strong>취재2</strong><strong>취재3</strong>${values.map(row => `<strong>${row[0]}</strong>${row.slice(1).map((value,index) => `<input type="number" min="0" max="300" value="${value}" data-zone="${row[0]}" data-index="${index}" aria-label="${row[0]} 구역 ${index + 1}차 방문객 수">`).join('')}`).join('')}</div></div>`);
      state.runAction = () => {
        const inputs = [...document.querySelectorAll('[data-zone]')];
        if (inputs.some(input => input.value.trim() === '' || !input.checkValidity())) {
          announce('방문객 수는 각 칸에 0~300 사이의 정수로 입력해 주세요.');
          return;
        }
        const rows = Object.keys(구역방문객).map(zone => {
          const visitors = [...document.querySelectorAll(`[data-zone="${zone}"]`)].map(input => Number(input.value));
          return {구역:zone, 합계:sum(visitors), 평균:mean(visitors).toFixed(2)};
        });
        const topTotal = Math.max(...rows.map(row => row.합계));
        const topZones = rows.filter(row => row.합계 === topTotal).map(row => row.구역).join('·');
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row">${rows.map(row => `<div class="metric"><span>${row.구역} 평균</span><strong>${row.평균}명</strong></div>`).join('')}</div>${tableHtml(rows,['구역','합계','평균'])}<p class="caption">세 번의 기록 안에서는 ${topZones} 구역의 합계가 ${topTotal}명으로 가장 큽니다. 화면의 표는 읽기 편하도록 평균을 소수점 이하 두 자리로 보여 줍니다. 파이썬 코드의 round(값, 2)는 소수점 이하 둘째 자리까지 반올림하므로 45.0이 출력될 수 있으며, 이는 45.00과 같은 값입니다.</p>`;
      };
    }

    function mountSeries() {
      simulatorShell(`<div class="control"><label for="seriesMode">찾는 방식</label><select id="seriesMode"><option value="loc">loc: 이름표</option><option value="iloc">iloc: 자리 번호</option></select></div><div class="control"><label for="seriesKey">찾을 값</label><select id="seriesKey"></select></div>`);
      const mode = document.querySelector('#seriesMode');
      const key = document.querySelector('#seriesKey');
      function setKeys() {
        const values = mode.value === 'loc' ? 시간대별축제소식수값.map(row => row.이름표) : [0,1,2,3,4];
        key.innerHTML = values.map(value => `<option>${value}</option>`).join('');
      }
      mode.addEventListener('change', setKeys);
      setKeys();
      state.runAction = () => {
        const labels = 시간대별축제소식수값.map(row => row.이름표);
        const values = 시간대별축제소식수값.map(row => row.축제소식수);
        const index = mode.value === 'loc' ? labels.indexOf(key.value) : Number(key.value);
        document.querySelector('#simOutput').innerHTML = `<h4 class="output-title">${mode.value}[${mode.value === 'loc' ? `'${key.value}'` : key.value}] → ${values[index]}건</h4>${tableHtml(시간대별축제소식수값,['이름표','자리','축제소식수'],index)}<p class="caption">시간대마다 기록할 값이 축제 소식 수 한 가지라서 Series 한 줄로 충분합니다. loc는 시간 이름표 ${labels[index]}, iloc는 자리 ${index}를 사용해 같은 ${values[index]}건을 찾습니다.</p>`;
      };
    }

    function mountSelect() {
      const 이름표비교부스표 = [
        {행이름표:2, 자리:0, 부스이름:'먹거리'},
        {행이름표:5, 자리:1, 부스이름:'사진관'},
        {행이름표:8, 자리:2, 부스이름:'미니게임'}
      ];

        if (query === 'row') html = tableHtml([축제부스표[2]],['인덱스','부스번호','부스이름','대기시간분','만족도']);
        if (query === 'cell') html = `<div class="metric"><span>음료 부스의 대기 시간</span><strong>14분</strong></div><p class="caption">① 쉼표 왼쪽의 3으로 행 이름표 3인 음료를 찾습니다. ② 오른쪽의 대기시간분으로 열을 찾습니다. 그 행과 열이 만나는 값은 14분입니다.</p>`;

        if (query === 'all') html = `${tableHtml(축제부스표,['인덱스','부스번호','부스이름','대기시간분','만족도'])}<p class="caption">행 하나는 부스 하나, 열 하나는 부스에서 확인할 항목 하나입니다. 여러 부스의 여러 항목을 비교해야 해서 DataFrame을 사용했습니다.</p>`;
        if (query === 'slice') html = `${tableHtml(축제부스표.slice(0,3).map(row => ({인덱스:row.인덱스,부스번호:row.부스번호,부스이름:row.부스이름,대기시간분:row.대기시간분})),['인덱스','부스번호','부스이름','대기시간분'])}<p class="caption">행의 :2는 처음부터 행 이름표 2까지, 열의 :'대기시간분'은 처음부터 대기시간분 열까지 고릅니다. loc의 범위는 끝 이름표도 포함하므로 행 이름표 2와 대기시간분 열도 함께 나옵니다.</p>`;

    function mountFilter() {
      simulatorShell(`<div class="control" style="min-width:min(430px,100%)"><label for="filterPreset">조건</label><select id="filterPreset"><option value="wait">대기시간분 > 15</option><option value="rating">만족도 >= 4.5</option><option value="and">대기시간분 >= 15 & 만족도 >= 4.4</option><option value="or">대기시간분 >= 15 | 만족도 >= 4.6</option></select></div>`);
      state.runAction = () => {
        const preset = document.querySelector('#filterPreset').value;
        const tests = {
          wait:row => row.대기시간분 > 15,
          rating:row => row.만족도 >= 4.5,
          and:row => row.대기시간분 >= 15 && row.만족도 >= 4.4,
          or:row => row.대기시간분 >= 15 || row.만족도 >= 4.6
        };
        const result = 축제부스표.filter(tests[preset]);
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>전체 부스</span><strong>5개</strong></div><div class="metric"><span>남은 부스</span><strong>${result.length}개</strong></div><div class="metric"><span>조건 연결</span><strong>${preset === 'and' ? '모두' : preset === 'or' ? '하나 이상' : '한 조건'}</strong></div></div>${tableHtml(result,['부스번호','부스이름','대기시간분','만족도'])}`;
      };
    }

    function mountSort() {
      simulatorShell(`<div class="control"><label for="sortMode">표 바꾸기</label><select id="sortMode"><option value="asc">원본 다섯 부스 · 대기 시간 오름차순</option><option value="desc">원본 다섯 부스 · 대기 시간 내림차순</option><option value="transpose">앞 장에서 고른 네 후보 · 행과 열 바꾸기(전치)</option></select></div>`);
      state.runAction = () => {
        const mode = document.querySelector('#sortMode').value;
        if (mode === 'transpose') {
          const candidates = 축제부스표.filter(row => row.대기시간분 >= 15 || row.만족도 >= 4.6);
          const rows = ['부스번호','부스이름','대기시간분','만족도'].map(key => Object.fromEntries([['항목',key], ...candidates.map(row => [String(row.인덱스), row[key]])]));
          document.querySelector('#simOutput').innerHTML = `${tableHtml(rows,['항목', ...candidates.map(row => String(row.인덱스))])}<p class="caption">앞 장의 | 조건에서 둘 중 하나 이상을 만족한 먹거리·사진관·미니게임·책갈피 네 후보입니다. 전치하면 원래 행 이름표 0, 1, 2, 4가 열 이름표로 옮겨지고 부스이름도 한 행으로 보입니다. 값은 바뀌지 않고 읽는 방향만 바뀝니다.</p>`;
          return;
        }
        const result = cloneRows(축제부스표).sort((a,b) => mode === 'asc' ? a.대기시간분 - b.대기시간분 : b.대기시간분 - a.대기시간분);
        document.querySelector('#simOutput').innerHTML = `${tableHtml(result,['인덱스','부스번호','부스이름','대기시간분','만족도'])}<p class="caption">원본 다섯 부스를 정렬했습니다. 값과 행 이름표(인덱스)는 그대로이고 보이는 행 순서만 달라집니다.</p>`;
      };
    }

    function mountTablework() {
      simulatorShell(`<div class="control" style="min-width:min(430px,100%)"><label for="tableOperation">표 연산</label><select id="tableOperation"><option value="base">기본 부스 방문표</option><option value="average">낮평균 열 추가</option><option value="total">낮평균과 합계 열 추가</option><option value="evening">합계 삭제 후 저녁 열을 3번 위치에 삽입</option><option value="dropMini">미니게임 행 제외 · axis=0</option><option value="dropPhoto">사진관 행도 제외 · axis=0</option><option value="dropEvening">두 부스 제외 후 저녁 열 제외 · axis=1</option><option value="dropAfternoon">두 부스 제외 후 저녁·오후 열 제외 · axis=1</option></select></div>`);
      state.runAction = () => {
        const operation = document.querySelector('#tableOperation').value;
        let rows = cloneRows(기본부스방문표);
        let columns = ['부스','오전','점심','오후'];
        if (operation !== 'base') { rows.forEach(row => row.낮평균 = ((row.오전 + row.점심 + row.오후) / 3).toFixed(2)); columns.push('낮평균'); }
        if (operation === 'total') { rows.forEach(row => row.합계 = row.오전 + row.점심 + row.오후); columns.push('합계'); }
        if (['evening','dropMini','dropPhoto','dropEvening','dropAfternoon'].includes(operation)) { rows.forEach((row,index) => row.저녁 = [40,50,45,55][index]); columns = ['부스','오전','점심','오후','저녁','낮평균']; }
        if (['dropMini','dropPhoto','dropEvening','dropAfternoon'].includes(operation)) rows = rows.filter(row => row.부스 !== '미니게임');
        if (['dropPhoto','dropEvening','dropAfternoon'].includes(operation)) rows = rows.filter(row => row.부스 !== '사진관');
        if (operation === 'dropEvening') columns = columns.filter(column => column !== '저녁');
        if (operation === 'dropAfternoon') columns = columns.filter(column => !['저녁','오후'].includes(column));
        document.querySelector('#simOutput').innerHTML = `<div class="metric-row"><div class="metric"><span>부스 행 수</span><strong>${rows.length}</strong></div><div class="metric"><span>자료 열 수</span><strong>${columns.length - 1}</strong></div><div class="metric"><span>axis 확인</span><strong>${operation.startsWith('drop') ? (['dropMini','dropPhoto'].includes(operation) ? '0 · 행' : '1 · 열') : '—'}</strong></div></div>${tableHtml(rows,columns)}${operation.startsWith('drop') ? '<p class="caption">drop으로 만든 새 표입니다. 원본 부스방문표에는 여전히 네 부스가 있습니다. 마지막 결과의 낮평균은 열을 지우기 전 오전·점심·오후 세 값으로 계산한 값입니다.</p>' : ''}`;
      };
    }

    function mountMissing() {
      simulatorShell(`<div class="control" style="min-width:min(390px,100%)"><label for="missingMethod">빈칸 처리 방법</label><select id="missingMethod"><option value="keep">NaN 그대로 두고 빈 원인 확인</option><option value="row">미니게임 행 전체 제외 · dropna(axis=0)</option><option value="column">점심 열 전체 제외 · dropna(axis=1)</option><option value="text">'확인 중'으로 채우기 · 화면 표시용</option><option value="mean">나머지 세 부스의 점심 평균으로 채우기</option></select></div>`);
      state.runAction = () => {
        const method = document.querySelector('#missingMethod').value;
        let rows = cloneRows(기본부스방문표).map((row,index) => ({...row, 점심:row.부스 === '미니게임' ? null : row.점심, 저녁:[40,50,45,55][index]}));
        let columns = ['부스','오전','점심','오후','저녁'];
        let note = 'NaN은 Not a Number의 줄임말이며 여기서는 “아직 모르는 방문객 수”입니다. 0명으로 단정하지 말고 취재 누락인지 기기 문제인지 먼저 확인합니다.';
        if (method === 'row') { rows = rows.filter(row => row.점심 !== null); note = '미니게임 행이 사라져 부스 수가 4개에서 3개로 줄었습니다.'; }
        if (method === 'column') { columns = columns.filter(column => column !== '점심'); note = '점심 열 전체가 사라져 다른 부스의 정상 점심 기록도 함께 잃었습니다.'; }
        if (method === 'text') { rows.forEach(row => { if (row.점심 === null) row.점심 = '확인 중'; }); note = '화면의 빈칸은 사라졌지만 숫자와 문자가 섞여 점심 평균 계산이 어려워집니다.'; }
        if (method === 'mean') {
          const average = mean(rows.filter(row => row.점심 !== null).map(row => row.점심));
          rows.forEach(row => { if (row.점심 === null) row.점심 = Number(average.toFixed(2)); });
          note = `나머지 부스의 점심 평균 ${average.toFixed(2)}명으로 채웠습니다. 실제 관측값이 아니라 대체값이라는 기록을 남겨야 합니다.`;
        }
        document.querySelector('#simOutput').innerHTML = `${tableHtml(rows,columns)}<div class="teacher-tip" style="margin-top:12px"><strong>처리 결과</strong>${note}</div>`;
      };
    }
